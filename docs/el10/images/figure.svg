    <path d="M58 70 Q58 84 72 84 Q58 84 58 98 Q58 84 44 84 Q58 84 58 70 Z" fill="#4CC9F0"/>
    <path d="M342 56 Q342 68 354 68 Q342 68 342 80 Q342 68 330 68 Q342 68 342 56 Z" fill="#FF6B6B"/>
