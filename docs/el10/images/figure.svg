    <path d="M256.6 53.4 A80 80 0 0 1 143.4 166.6 A100 100 0 0 0 256.6 53.4 Z" fill="#1F2133" stroke="none"/>
    <circle cx="200" cy="110" r="80" fill="none"/>
    <path d="M144 84 Q156 52 196 42" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.75"/>
    <circle cx="140" cy="102" r="4" fill="#FFFFFF" stroke="none" opacity="0.75"/>
    <path d="M262 122 Q260 144 246 160" fill="none" stroke="#4CC9F0" stroke-width="4" opacity="0.6"/>

