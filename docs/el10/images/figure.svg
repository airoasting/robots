    <circle cx="173" cy="118" r="18" fill="#FFFFFF" stroke="none"/>
    <circle cx="176" cy="121" r="11" fill="#4CC9F0" stroke="none"/>
    <circle cx="177" cy="122" r="6.5" fill="#2B2D42" stroke="none"/>
    <circle cx="170" cy="113" r="5" fill="#FFFFFF" stroke="none"/>
    <circle cx="181" cy="127" r="2" fill="#FFFFFF" stroke="none"/>
    <circle cx="227" cy="118" r="18" fill="#FFFFFF" stroke="none"/>
    <circle cx="230" cy="121" r="11" fill="#4CC9F0" stroke="none"/>
    <circle cx="231" cy="122" r="6.5" fill="#2B2D42" stroke="none"/>
    <circle cx="224" cy="113" r="5" fill="#FFFFFF" stroke="none"/>
    <circle cx="235" cy="127" r="2" fill="#FFFFFF" stroke="none"/>
    <path d="M190 144 Q200 152 210 144" fill="none" stroke="#4CC9F0" stroke-width="4"/>
    <ellipse cx="156" cy="144" rx="7" ry="4" fill="#FF6B6B" stroke="none" opacity="0.8"/>
    <ellipse cx="244" cy="144" rx="7" ry="4" fill="#FF6B6B" stroke="none" opacity="0.8"/>
  </g>
</svg>
