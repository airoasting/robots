    <path d="M152 82 Q180 88 182 118 H166 Q166 96 152 82 Z" fill="#F5B700" stroke="none"/>
    <path d="M94 122 Q96 80 140 78 Q184 80 186 122 Z" fill="none"/>
    <path d="M140 80 V100" fill="none" stroke-width="4"/>
    <circle cx="140" cy="106" r="8" fill="#FFF8E7" stroke-width="4"/>
    <ellipse cx="112" cy="100" rx="8" ry="4" fill="#FFFFFF" stroke="none" transform="rotate(-45 112 100)"/>
    <rect x="82" y="118" width="116" height="12" rx="6" fill="#FFD23F"/>

