    <path d="M98 226 H182" fill="none" stroke-width="3"/>
    <ellipse cx="110" cy="207" rx="6" ry="2.5" fill="#FFFFFF" stroke="none"/>

    <!-- hands -->
    <circle cx="84" cy="270" r="12" fill="#4CC9F0"/>
    <circle cx="196" cy="270" r="12" fill="#4CC9F0"/>
    <circle cx="80" cy="266" r="3" fill="#FFFFFF" stroke="none"/>
    <circle cx="192" cy="266" r="3" fill="#FFFFFF" stroke="none"/>
