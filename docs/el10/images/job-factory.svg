    <circle cx="126" cy="151" r="11" fill="#FFFFFF" stroke="none"/>
    <circle cx="128" cy="153" r="7" fill="#4CC9F0" stroke="none"/>
    <circle cx="129" cy="154" r="4" fill="#2B2D42" stroke="none"/>
    <circle cx="123" cy="147" r="3" fill="#FFFFFF" stroke="none"/>
    <circle cx="154" cy="151" r="11" fill="#FFFFFF" stroke="none"/>
    <circle cx="156" cy="153" r="7" fill="#4CC9F0" stroke="none"/>
    <circle cx="157" cy="154" r="4" fill="#2B2D42" stroke="none"/>
    <circle cx="151" cy="147" r="3" fill="#FFFFFF" stroke="none"/>
    <path d="M133 165 Q140 171 147 165" fill="none" stroke="#4CC9F0" stroke-width="3"/>
    <ellipse cx="114" cy="165" rx="5" ry="3" fill="#FF6B6B" stroke="none" opacity="0.85"/>
