    <circle cx="188" cy="152" r="9" fill="#4CC9F0" stroke-width="4"/>
    <circle cx="140" cy="148" r="48" fill="#F5F7FA"/>
    <path d="M174 114 A48 48 0 0 1 106 182 A60 60 0 0 0 174 114 Z" fill="#D3D9E0" stroke="none"/>
