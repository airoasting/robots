    <circle cx="278" cy="314" r="7" fill="#E9ECEF" stroke-width="3"/>
    <circle cx="306" cy="314" r="7" fill="#E9ECEF" stroke-width="3"/>
    <circle cx="334" cy="314" r="7" fill="#E9ECEF" stroke-width="3"/>
    <circle cx="362" cy="314" r="7" fill="#E9ECEF" stroke-width="3"/>
