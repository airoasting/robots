    <path d="M360 300 Q360 312 372 312 Q360 312 360 324 Q360 312 348 312 Q360 312 360 300 Z" fill="#4CC9F0"/>
    <path d="M30 172 Q30 180 38 180 Q30 180 30 188 Q30 180 22 180 Q30 180 30 172 Z" fill="#FF6B6B"/>
    <path d="M226 324 Q226 332 234 332 Q226 332 226 340 Q226 332 218 332 Q226 332 226 324 Z" fill="#06D6A0"/>
