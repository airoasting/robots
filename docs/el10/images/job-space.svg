    <g transform="rotate(-70 236 212)">
      <rect x="223" y="214" width="26" height="54" rx="13" fill="#F5F7FA"/>
      <rect x="221" y="260" width="30" height="10" rx="5" fill="#FF6B6B" stroke-width="4"/>
      <circle cx="236" cy="282" r="13" fill="#F5F7FA"/>
