    <!-- glass helmet (back) -->
    <circle cx="200" cy="140" r="64" fill="#CFF1FC"/>

    <!-- robot head inside -->
    <path d="M200 96 V82" fill="none" stroke-width="4"/>
    <circle cx="200" cy="80" r="6" fill="#FFD23F" stroke-width="3"/>
    <circle cx="200" cy="146" r="48" fill="#E9ECEF"/>
    <path d="M234 112 A48 48 0 0 1 166 180 A60 60 0 0 0 234 112 Z" fill="#ADB5BD" stroke="none"/>
    <circle cx="200" cy="146" r="48" fill="none"/>
    <circle cx="182" cy="142" r="13" fill="#FFFFFF" stroke-width="4"/>
    <circle cx="184" cy="144" r="8" fill="#9B5DE5" stroke="none"/>
    <circle cx="185" cy="145" r="4.5" fill="#2B2D42" stroke="none"/>
    <circle cx="179" cy="138" r="3.5" fill="#FFFFFF" stroke="none"/>
    <circle cx="218" cy="142" r="13" fill="#FFFFFF" stroke-width="4"/>
    <circle cx="220" cy="144" r="8" fill="#9B5DE5" stroke="none"/>
    <circle cx="221" cy="145" r="4.5" fill="#2B2D42" stroke="none"/>
    <circle cx="215" cy="138" r="3.5" fill="#FFFFFF" stroke="none"/>
    <path d="M190 166 Q200 175 210 166" fill="none" stroke-width="4"/>
    <ellipse cx="170" cy="162" rx="6" ry="4" fill="#FF6B6B" stroke="none" opacity="0.8"/>
    <ellipse cx="230" cy="162" rx="6" ry="4" fill="#FF6B6B" stroke="none" opacity="0.8"/>

