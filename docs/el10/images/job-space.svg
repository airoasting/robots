    <path d="M164 298 Q171 322 178 298 Z" fill="#FF9F1C" stroke-width="3"/>
    <path d="M168 300 Q171 312 174 300 Z" fill="#FFD23F" stroke="none"/>
    <path d="M222 298 Q229 322 236 298 Z" fill="#FF9F1C" stroke-width="3"/>
