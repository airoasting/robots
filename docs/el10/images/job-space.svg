    <path d="M152 112 Q164 84 194 80" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.85"/>
    <circle cx="150" cy="128" r="4" fill="#FFFFFF" stroke="none" opacity="0.85"/>
    <path d="M250 154 Q246 176 230 190" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.5"/>
  </g>
</svg>
