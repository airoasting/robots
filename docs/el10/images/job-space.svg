    <path d="M210 201 H212 A27 27 0 0 1 239 228 V262 A27 27 0 0 1 212 289 H210 Z" fill="#D3D9E0" stroke="none"/>
    <ellipse cx="172" cy="222" rx="5" ry="10" fill="#FFFFFF" stroke="none"/>
    <rect x="176" y="222" width="48" height="30" rx="8" fill="#4CC9F0" stroke-width="4"/>
    <circle cx="189" cy="237" r="5" fill="#FF6B6B" stroke-width="3"/>
    <circle cx="203" cy="237" r="5" fill="#FFD23F" stroke-width="3"/>
    <circle cx="214" cy="232" r="3" fill="#06D6A0" stroke="none"/>
    <circle cx="214" cy="242" r="3" fill="#FFFFFF" stroke="none"/>
    <rect x="162" y="266" width="76" height="12" rx="6" fill="#FF9F1C" stroke-width="4"/>

