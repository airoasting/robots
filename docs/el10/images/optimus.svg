  <rect x="116" y="180" width="26" height="44" rx="11" fill="#FFFFFF" stroke="#2B2D42" stroke-width="6" stroke-linejoin="round"/>
  <rect x="258" y="180" width="26" height="44" rx="11" fill="#FFFFFF" stroke="#2B2D42" stroke-width="6" stroke-linejoin="round"/>
  <rect x="272" y="184" width="8" height="36" rx="4" fill="#E9ECEF"/>
  <!-- elbows -->
  <circle cx="130" cy="226" r="10" fill="#2B2D42"/>
  <circle cx="270" cy="226" r="10" fill="#2B2D42"/>
  <!-- forearms toward center -->
  <path d="M124 218 L168 222 Q178 224 176 236 L174 240 L128 240 Q118 238 120 228 Z" fill="#FFFFFF" stroke="#2B2D42" stroke-width="6" stroke-linejoin="round"/>
  <path d="M276 218 L232 222 Q222 224 224 236 L226 240 L272 240 Q282 238 280 228 Z" fill="#FFFFFF" stroke="#2B2D42" stroke-width="6" stroke-linejoin="round"/>
  <path d="M268 222 L276 222 Q280 228 276 236 L268 236 Z" fill="#E9ECEF"/>
