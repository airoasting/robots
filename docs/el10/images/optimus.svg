  <path d="M166 238 Q160 222 176 218 L196 224 L198 244 Q182 252 168 246 Z" fill="#2B2D42" stroke="#2B2D42" stroke-width="5" stroke-linejoin="round"/>
  <path d="M234 238 Q240 222 224 218 L204 224 L202 244 Q218 252 232 246 Z" fill="#2B2D42" stroke="#2B2D42" stroke-width="5" stroke-linejoin="round"/>
  <!-- the egg -->
  <path d="M200 186 Q216 188 218 212 Q218 230 200 232 Q182 230 182 212 Q184 188 200 186 Z" fill="#FFF8E7" stroke="#2B2D42" stroke-width="5" stroke-linejoin="round"/>
  <path d="M208 194 Q216 202 215 216 Q213 228 202 230 Q212 222 210 210 Q209 200 208 194 Z" fill="#F3E3C2"/>
  <ellipse cx="193" cy="200" rx="4" ry="7" fill="#FFFFFF" transform="rotate(15 193 200)"/>
  <!-- fingers wrapping egg (drawn over egg) -->
  <path d="M176 222 Q180 214 188 214" stroke="#2B2D42" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M224 222 Q220 214 212 214" stroke="#2B2D42" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M170 232 L186 230 M230 232 L214 230" stroke="#5C6070" stroke-width="2.5" stroke-linecap="round"/>
  <!-- gentle care hearts -->
  <path d="M226 176 Q226 170 231 170 Q236 170 236 176 Q236 170 241 170 Q246 170 246 176 Q246 182 236 188 Q226 182 226 176 Z" fill="#FF6B6B" stroke="#2B2D42" stroke-width="3" stroke-linejoin="round"/>
  <path d="M160 180 Q160 176 163 176 Q166 176 166 180 Q166 176 169 176 Q172 176 172 180 Q172 184 166 188 Q160 184 160 180 Z" fill="#FF6B6B" stroke="#2B2D42" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- neck -->
  <rect x="186" y="132" width="28" height="18" rx="5" fill="#2B2D42" stroke="#2B2D42" stroke-width="4"/>
  <path d="M190 140 L210 140" stroke="#5C6070" stroke-width="2.5" stroke-linecap="round"/>

  <!-- HEAD -->
  <path d="M138 92 Q138 34 200 34 Q262 34 262 92 Q262 138 220 140 L180 140 Q138 138 138 92 Z" fill="#FFFFFF" stroke="#2B2D42" stroke-width="6" stroke-linejoin="round"/>
  <path d="M232 42 Q258 56 258 92 Q258 132 222 136 Q246 120 246 88 Q246 60 232 42 Z" fill="#E9ECEF"/>
  <ellipse cx="172" cy="50" rx="16" ry="6" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="2" transform="rotate(-18 172 50)"/>
  <!-- glossy black face plate -->
  <path d="M152 86 Q152 62 200 62 Q248 62 248 86 Q248 128 214 130 L186 130 Q152 128 152 86 Z" fill="#2B2D42" stroke="#2B2D42" stroke-width="4" stroke-linejoin="round"/>
  <path d="M162 80 Q166 68 186 67" stroke="#6C7080" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M232 112 Q238 104 240 94" stroke="#1A1B29" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- eyes on face plate -->
  <circle cx="180" cy="96" r="14" fill="#FFFFFF"/>
  <circle cx="220" cy="96" r="14" fill="#FFFFFF"/>
  <circle cx="182" cy="98" r="8" fill="#2B2D42"/>
  <circle cx="222" cy="98" r="8" fill="#2B2D42"/>
  <circle cx="185" cy="94" r="3" fill="#FFFFFF"/>
  <circle cx="225" cy="94" r="3" fill="#FFFFFF"/>
  <circle cx="179" cy="101" r="1.5" fill="#FFFFFF"/>
  <circle cx="219" cy="101" r="1.5" fill="#FFFFFF"/>
  <!-- cheeks + smile -->
  <ellipse cx="166" cy="114" rx="6" ry="3.5" fill="#FF6B6B" opacity="0.85"/>
  <ellipse cx="234" cy="114" rx="6" ry="3.5" fill="#FF6B6B" opacity="0.85"/>
  <path d="M192 115 Q200 122 208 115" stroke="#4CC9F0" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- side ear sensors -->
  <rect x="130" y="84" width="10" height="24" rx="4" fill="#ADB5BD" stroke="#2B2D42" stroke-width="4"/>
  <rect x="260" y="84" width="10" height="24" rx="4" fill="#ADB5BD" stroke="#2B2D42" stroke-width="4"/>
</svg>
