      <stop offset="0" stop-color="#FFF8E7"/>
      <stop offset="1" stop-color="#EEF0F3"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect x="0" y="0" width="400" height="400" fill="url(#optimus-bg)"/>
  <circle cx="200" cy="200" r="168" fill="#E9ECEF"/>
  <circle cx="200" cy="200" r="168" fill="none" stroke="#D3D8DD" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>
  <!-- sparkles -->
  <path d="M62 96 L68 110 L82 116 L68 122 L62 136 L56 122 L42 116 L56 110 Z" fill="#FFD23F" stroke="#2B2D42" stroke-width="3" stroke-linejoin="round"/>
  <path d="M338 84 L342 94 L352 98 L342 102 L338 112 L334 102 L324 98 L334 94 Z" fill="#FF6B6B" stroke="#2B2D42" stroke-width="3" stroke-linejoin="round"/>
