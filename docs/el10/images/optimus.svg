  <path d="M140 160 Q140 146 156 146 L244 146 Q260 146 260 160 L252 232 Q250 248 234 248 L166 248 Q150 248 148 232 Z" fill="#FFFFFF" stroke="#2B2D42" stroke-width="6" stroke-linejoin="round"/>
