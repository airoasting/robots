<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="pepper-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3EAFD"/>
      <stop offset="1" stop-color="#E2D0F8"/>
    </linearGradient>
  </defs>

  <!-- backdrop blob -->
  <circle cx="200" cy="196" r="172" fill="url(#pepper-bg)"/>
  <circle cx="200" cy="196" r="148" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="2 20" stroke-linecap="round" opacity="0.85"/>

  <!-- sparkles -->
  <g stroke="#2B2D42" stroke-width="3" stroke-linejoin="round">
    <path d="M58 70 Q58 84 72 84 Q58 84 58 98 Q58 84 44 84 Q58 84 58 70 Z" fill="#FFD23F"/>
    <path d="M296 22 Q296 32 306 32 Q296 32 296 42 Q296 32 286 32 Q296 32 296 22 Z" fill="#9B5DE5"/>
    <path d="M346 236 Q346 248 358 248 Q346 248 346 260 Q346 248 334 248 Q346 248 346 236 Z" fill="#06D6A0"/>
    <path d="M46 253 Q46 262 55 262 Q46 262 46 271 Q46 262 37 262 Q46 262 46 253 Z" fill="#FF6B6B"/>
    <path d="M322 318 Q322 326 330 326 Q322 326 322 334 Q322 326 314 326 Q322 326 322 318 Z" fill="#4CC9F0"/>
  </g>
  <circle cx="96" cy="38" r="4" fill="#FF6B6B"/>
  <circle cx="30" cy="170" r="4" fill="#4CC9F0"/>
  <circle cx="80" cy="328" r="5" fill="#FFD23F"/>

  <!-- ground shadow -->
  <ellipse cx="200" cy="370" rx="108" ry="12" fill="#2B2D42" opacity="0.18"/>

