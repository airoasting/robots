<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARGOS · 로봇 백과사전</title>
<meta name="description" content="휴머노이드 로봇의 구조와 유형, 역사, 주요 업체를 한 페이지에서 살펴보는 로봇 백과사전입니다. 로봇이 실제로 수행할 수 있는 업무도 함께 다룹니다.">
<meta name="theme-color" content="#24282D">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logos/logo-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/logos/logo-64.png">
<link rel="apple-touch-icon" href="../assets/logos/logo-180.png">

<style>
/* outline display face: static ExtraBold (merged contours, so text-stroke draws clean outlines) */
@font-face{font-family:'Pretendard Outline';font-weight:800;font-style:normal;font-display:swap;
  src:url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-ExtraBold.woff2') format('woff2')}
/* ===== ARGOS design tokens: Technical Folio (DESIGN.md). Sections use var() only ===== */
:root{
  --bg:#2C3136; --bg-2:#24282D; --surface:#41484F; --surface-2:#4B535A;
  --line:#555D65; --line-2:#717A83;
  --text:#F2F1EC; --muted:#C5C9CC; --dim:#B0B6BC; /* dim raised for projectors: 13px labels hold ~4:1 with a 5% black lift */
  --accent:#F2A900; --accent-2:#FFD27A; --accent-ink:#1D1F22;
  --steel:#6E9BD6; --steel-ink:#AFC8E8;
  --danger:#E9785A; --ok:#7FC8A9;
  --radius:4px; --ease:cubic-bezier(.2,.7,.1,1);
  --f-display:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo',sans-serif;
  --f-body:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo',sans-serif;
  --f-mono:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif; /* label face: same family, tabular figures */
  --nav-h:64px;
  --gutter:clamp(16px,4vw,56px);
  color-scheme:dark;
}
@media (max-width:760px){ :root{ --nav-h:56px; } }

*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--f-body);font-size:17px;line-height:1.75;font-weight:400;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  
  overflow-x:hidden;overflow-x:clip;
  word-break:keep-all;overflow-wrap:break-word;
}
img,svg,canvas,video,iframe{max-width:100%}
a{color:inherit}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* scrollbar */
html{scrollbar-width:thin;scrollbar-color:var(--line-2) var(--bg-2)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-2)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;border:2px solid var(--bg-2)}
::-webkit-scrollbar-thumb:hover{background:var(--line-2)}

/* ===== shared section base (zero specificity: section rules win) ===== */
:where(.sec){position:relative;padding-block:clamp(72px,8vw,128px);scroll-margin-top:0}
:where(.sec) :where(h1,h2,h3,h4){font-family:var(--f-display)}

/* ===== shared utilities ===== */
.sec h1,.sec h2,.sec h3{text-wrap:balance}
.sec p,.sec li{text-wrap:pretty}
.h-display{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(34px,4.2vw,60px);line-height:1.2;letter-spacing:-.03em;color:var(--text)}
.lead{margin:22px 0 0;max-width:none;font-size:18px;line-height:1.75;color:var(--muted)}
.sec p.lead{text-wrap:wrap}
.wrap{max-width:1360px;margin:0 auto;padding:0 var(--gutter)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.js .reveal{opacity:0;transform:translateY(16px)}
.js .reveal.is-in{opacity:1;transform:none;transition:opacity .7s var(--ease),transform .7s var(--ease)}

/* sheet head: the page's only numbering system (one per section) */
.sheet{display:flex;align-items:baseline;gap:20px;margin:0 0 28px;padding-top:14px;border-top:1px solid var(--line-2);font:500 13px/1.4 var(--f-mono);letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--dim)}
.sheet-no{color:var(--accent);font-weight:600}
.sheet-name{color:var(--text);font-family:var(--f-body);font-size:14px;font-weight:600;letter-spacing:0}
.sheet-meta{margin-left:auto;font-variant-numeric:tabular-nums}
/* legacy alias: kept so an un-migrated .overline never renders as the old uppercase label */
.overline{margin:0 0 20px;font:500 13px/1.4 var(--f-mono);letter-spacing:.04em;color:var(--accent)}

/* skip link */
.skip{position:fixed;left:16px;top:-60px;z-index:200;padding:10px 14px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line-2);font:500 13px/1 var(--f-mono);color:var(--text);text-decoration:none;transition:top .2s var(--ease)}
.skip:focus{top:12px}

/* ===== top nav: solid bar, hairline, no blur ===== */
.tn{position:fixed;left:0;right:0;top:0;z-index:100;height:var(--nav-h);
  display:flex;align-items:center;gap:28px;padding:0 var(--gutter);
  background:var(--bg-2);border-bottom:1px solid var(--line);
  transition:background .3s var(--ease),border-color .3s var(--ease)}
.tn.is-top{background:color-mix(in srgb,var(--bg-2) 0%,transparent);border-bottom-color:transparent}
.tn-logo{flex:0 0 auto;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
.tn-logo img{display:block;width:28px;height:28px;flex:0 0 auto;border-radius:50%}
.tn-logo b{display:flex;align-items:baseline;gap:10px;font:700 16px/1 var(--f-display);letter-spacing:.12em}
.tn-logo .tn-sub{font:500 13px/1 var(--f-mono);letter-spacing:.06em;color:var(--dim);padding-left:10px;border-left:1px solid var(--line-2)}
.tn-links{position:relative;flex:1 1 auto;min-width:0;display:flex;justify-content:flex-end;gap:2px;margin:0;padding:0;list-style:none;
  overflow-x:auto;scrollbar-width:none}
.tn-links::-webkit-scrollbar{display:none}
.tn-links li{flex:0 0 auto}
.tn-links a{position:relative;display:flex;align-items:center;gap:8px;height:var(--nav-h);padding:0 12px;
  font:500 14px/1 var(--f-body);color:var(--muted);text-decoration:none;white-space:nowrap;transition:color .25s var(--ease)}
.tn-links a span{font:500 13px/1 var(--f-mono);color:var(--dim);transition:color .25s var(--ease)}
.tn-links a::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:0 50%;transition:transform .35s var(--ease)}
.tn-links a:hover{color:var(--text)}
.tn-links a.is-on{color:var(--text)}
.tn-links a.is-on span{color:var(--accent)}
.tn-links a.is-on::after{transform:none}
.tn-bar{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent;pointer-events:none}
.tn-bar i{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--line-2)}
@media (max-width:1100px){ .tn-logo .tn-sub{display:none} }
@media (max-width:760px){
  .tn{gap:12px;padding:0 16px}
  .tn-logo{gap:8px}
  .tn-logo b{font-size:14px;letter-spacing:.1em}
  .tn-links{justify-content:flex-start;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 20px),transparent)}
  .tn-links a{padding:0 10px;font-size:13.5px}
  .tn-links a::after{left:10px;right:10px}
  .tn-links a span{display:none}
}

/* ===== section backgrounds: one continuous graphite gradient =====
   Each section ends on the tone the next one starts with, so light and shade alternate
   down the page without a seam. A faint top light gives each sheet its own studio feel.
   Sections do not set their own background; tones live here only. */
:root{--tone-hi:#353B41;--tone-lo:#212529;--tone-floor:#1C1F23;--tone-light:color-mix(in srgb,var(--text) 5%,transparent)}
#anatomy{background:radial-gradient(80% 50% at 50% 0%,var(--tone-light),transparent 70%),linear-gradient(180deg,var(--bg) 0%,var(--tone-lo) 100%)}
#types{background:radial-gradient(80% 50% at 50% 0%,var(--tone-light),transparent 70%),linear-gradient(180deg,var(--tone-lo) 0%,var(--tone-hi) 100%)}
#players{background:radial-gradient(80% 40% at 50% 0%,var(--tone-light),transparent 70%),linear-gradient(180deg,var(--tone-hi) 0%,var(--tone-lo) 100%)}
#reality{background:radial-gradient(80% 30% at 50% 0%,var(--tone-light),transparent 70%),linear-gradient(180deg,var(--tone-lo) 0%,var(--tone-hi) 100%)}
#history{background:radial-gradient(80% 50% at 50% 0%,var(--tone-light),transparent 70%),linear-gradient(180deg,var(--tone-hi) 0%,var(--tone-lo) 100%)}
#glossary{background:radial-gradient(80% 50% at 50% 0%,var(--tone-light),transparent 70%),linear-gradient(180deg,var(--tone-lo) 0%,var(--bg) 100%)}

/* ===== footer: colophon ===== */
.ft{position:relative;padding:clamp(72px,8vw,112px) 0 40px;border-top:1px solid var(--line-2);background:linear-gradient(180deg,var(--bg-2) 0%,var(--tone-floor) 100%);color:var(--muted)}
.ft-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:56px}
.ft-brand b{display:block;font:700 40px/1 var(--f-display);letter-spacing:.1em;color:var(--text)}
.ft-brand p{margin:18px 0 0;max-width:380px;font-size:16px;line-height:1.75}
.ft-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:40px}
.ft-ch ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
.ft h3{margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line-2);font:600 14px/1.4 var(--f-body);color:var(--text)}
.ft ul{margin:0;padding:0;list-style:none}
.ft li{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.55}
.ft li small{display:block;margin-top:3px;font:400 13px/1.5 var(--f-mono);color:var(--dim);overflow-wrap:anywhere}
.ft a{color:var(--text);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;transition:color .25s var(--ease),text-decoration-color .25s var(--ease)}
.ft a:hover{color:var(--accent-2);text-decoration-color:var(--accent)}
.ft-note{margin:48px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:14px;line-height:1.75;color:var(--dim)}
.ft-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;margin-top:24px;font:500 13px/1.6 var(--f-mono);letter-spacing:.04em;color:var(--dim)}
@media (max-width:900px){
  .ft-top{grid-template-columns:1fr;gap:40px}
  .ft-cols{grid-template-columns:1fr;gap:36px}
}
@media (max-width:520px){
  .ft-ch ul{grid-template-columns:1fr}
}

@media (max-width:420px){
  .tn-logo img{width:24px;height:24px}
  .tn-logo b{font-size:13px;letter-spacing:.06em}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .js .reveal{opacity:1;transform:none}
  .tn,.tn-links a,.tn-links a::after,.ft a{transition:none}
}
/* hero loader: hold the page still until the 3D hero has built its pin */
html.hero-loading{overflow:hidden}
</style>

<!-- Libraries: loaded once here. Sections must not load them again. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script>
document.documentElement.classList.add('js');
if (window.gsap && window.ScrollTrigger) { gsap.registerPlugin(ScrollTrigger); }
</script>

<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>

<header class="tn is-top" role="banner">
  <a class="tn-logo" href="#top" aria-label="ARGOS | AI ROASTING, 맨 위로 이동">
    <img src="../assets/logos/logo-white-64.png" width="28" height="28" alt="" aria-hidden="true">
    <b aria-hidden="true">ARGOS<span class="tn-sub">AI ROASTING</span></b>
  </a>
  <nav aria-label="섹션 이동" style="display:contents">
    <ul class="tn-links" data-tn-links></ul>
  </nav>
  <div class="tn-bar" aria-hidden="true"><i data-tn-bar></i></div>
</header>

<main id="main">
<span id="top"></span>
<!--SECTIONS-->
</main>

<footer class="ft" role="contentinfo">
  <div class="wrap">
    <div class="ft-top">
      <div class="ft-brand">
        <b>ARGOS</b>
        <p>휴머노이드 로봇의 구조와 유형, 역사, 업체를 한 화면에서 살펴보는 로봇 백과사전입니다. 로봇이 실제로 수행할 수 있는 업무도 함께 다룹니다.</p>
      </div>
      <div class="ft-cols">
        <div>
          <h3>리서치 출처</h3>
          <!--SOURCES_RESEARCH-->
        </div>
        <div class="ft-ch">
          <h3>업체 공식 채널</h3>
          <!--SOURCES_CHANNELS-->
        </div>
      </div>
    </div>
    <p class="ft-note"><!--SOURCE_NOTE--></p>
    <div class="ft-meta">
      <span>ARGOS 로봇 백과사전 | AI ROASTING © 2026</span>
    </div>
  </div>
</footer>

<script>
/* ===== shell runtime: nav, progress, cursor, reveal, single refresh ===== */
(function () {
  var doc = document.documentElement;
  var G = window.gsap, ST = window.ScrollTrigger;
  var RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var secs = Array.prototype.slice.call(document.querySelectorAll('main > .sec[data-nav], main .sec[data-nav]'));
  secs = secs.filter(function (s, i) { return secs.indexOf(s) === i; });

  /* --- nav links from data-nav (first section is the logo target) --- */
  var list = document.querySelector('[data-tn-links]');
  var links = [];
  secs.forEach(function (s, i) {
    if (i === 0) return;
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = '#' + s.id;
    a.innerHTML = '<span>' + String(i).padStart(2, '0') + '</span>';
    a.appendChild(document.createTextNode(s.getAttribute('data-nav')));
    li.appendChild(a); list.appendChild(li);
    links.push({ a: a, s: s });
  });
  var logo = document.querySelector('.tn-logo');
  if (secs[0]) logo.setAttribute('href', '#' + secs[0].id);

  /* --- scroll position helpers (pinned sections live inside .pin-spacer) --- */
  function box(s) { var p = s.parentElement; return (p && p.classList.contains('pin-spacer')) ? p : s; }
  function topOf(s) { return box(s).getBoundingClientRect().top + window.scrollY; }

  /* smooth anchor jumps that account for pin spacers */
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    var id = a.getAttribute('href').slice(1);
    if (!id) return;
    var t = document.getElementById(id);
    if (!t) return;
    var s = t.classList.contains('sec') ? t : null;
    if (!s && id !== 'top' && id !== 'main') return;
    e.preventDefault();
    jumpTo(s);
    if (history.replaceState) history.replaceState(null, '', '#' + id);
  });

  /* A long smooth scroll can be cut short when a section refreshes ScrollTrigger
     mid-flight (layout shifts). Re-check once scrolling settles and finish the jump. */
  var jumpTimer = 0, jumpTries = 0, jumping = false, jumpSec = null;
  function jumpTo(s) {
    jumpSec = s; jumpTries = 0; jumping = true;
    window.scrollTo({ top: Math.max(0, s ? topOf(s) : 0), behavior: RM ? 'auto' : 'smooth' });
    armJump();
  }
  function armJump() {
    clearTimeout(jumpTimer);
    jumpTimer = setTimeout(function () {
      var y = Math.max(0, jumpSec ? topOf(jumpSec) : 0);
      if (Math.abs(window.scrollY - y) > 4 && jumpTries < 3) {
        jumpTries++;
        window.scrollTo({ top: y, behavior: (RM || jumpTries > 1) ? 'auto' : 'smooth' });
        armJump();
      } else { jumping = false; }
    }, 220);
  }
  window.addEventListener('scroll', function () { if (jumping) armJump(); }, { passive: true });
  ['wheel', 'touchstart', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, function () { if (jumping) { jumping = false; clearTimeout(jumpTimer); } }, { passive: true });
  });

  /* --- active section + progress bar --- */
  var nav = document.querySelector('.tn');
  var bar = document.querySelector('[data-tn-bar]');
  var cur = -1, ticking = false;
  function update() {
    ticking = false;
    var y = window.scrollY, vh = window.innerHeight;
    var max = Math.max(1, doc.scrollHeight - vh);
    bar.style.transform = 'scaleX(' + Math.min(1, Math.max(0, y / max)).toFixed(4) + ')';
    nav.classList.toggle('is-top', y < 8);
    var probe = y + vh * 0.38, idx = -1;
    for (var i = 0; i < links.length; i++) { if (topOf(links[i].s) <= probe) idx = i; }
    if (idx !== cur) {
      cur = idx;
      links.forEach(function (l, j) {
        var on = j === idx;
        l.a.classList.toggle('is-on', on);
        if (on) { l.a.setAttribute('aria-current', 'true'); } else { l.a.removeAttribute('aria-current'); }
      });
      if (idx >= 0) {
        var a = links[idx].a, ul = list;
        var left = a.offsetLeft - (ul.clientWidth - a.offsetWidth) / 2;
        if (ul.scrollWidth > ul.clientWidth) ul.scrollTo({ left: left, behavior: RM ? 'auto' : 'smooth' });
      }
    }
  }
  function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  update();

  /* --- shared .reveal: fade + translateY 24px, 0.9s --- */
  var rev = Array.prototype.slice.call(document.querySelectorAll('.reveal'));
  if (RM || !('IntersectionObserver' in window)) {
    rev.forEach(function (el) { el.classList.add('is-in'); });
  } else {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); } });
    }, { rootMargin: '0px 0px -12% 0px' });
    rev.forEach(function (el) { io.observe(el); });
  }

  /* --- one ScrollTrigger.refresh after every section, font and image is in --- */
  if (ST) {
    var loaded = new Promise(function (r) { if (document.readyState === 'complete') r(); else window.addEventListener('load', r, { once: true }); });
    var fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    var hero = window.__heroReady || Promise.resolve(); /* the hero builds its pin after a progressive load */
    Promise.all([loaded, fonts, hero]).then(function () {
      setTimeout(function () { /* not rAF: rAF is paused in background tabs */
        /* Pins were created out of page order (hero is a module script and runs last).
           Sort by document position so earlier pins are measured first; a trigger that
           rides a containerAnimation is kept right after its container trigger. */
        var all = ST.getAll(), made = all.slice();
        var anchor = function (t) {
          var ca = t.vars.containerAnimation, c = ca && ca.scrollTrigger;
          return { el: (c ? c.trigger : t.trigger) || document.body, child: c ? 1 : 0 };
        };
        ST.sort(function (a, b) {
          var A = anchor(a), B = anchor(b);
          if (A.el !== B.el) {
            var pos = A.el.compareDocumentPosition(B.el);
            if (pos & Node.DOCUMENT_POSITION_FOLLOWING) return -1;
            if (pos & Node.DOCUMENT_POSITION_PRECEDING) return 1;
          }
          return (A.child - B.child) || (made.indexOf(a) - made.indexOf(b));
        });
        ST.refresh();
        update();
        if (location.hash && location.hash.length > 1) {
          var t = document.getElementById(location.hash.slice(1));
          if (t && t.classList.contains('sec')) window.scrollTo(0, topOf(t));
        }
      }, 0);
    });
  }
})();
</script>
