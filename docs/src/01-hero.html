<style>
#hero{position:relative;padding:0;height:100vh;height:100svh;min-height:560px;overflow:hidden;isolation:isolate;color:var(--text);font-family:var(--f-body);--studio-hi:#6a7178;--studio-mid:#4a5057;--studio-lo:#353a3f;background:radial-gradient(38% 58% at 66% 44%,var(--studio-hi) 0%,var(--studio-mid) 44%,var(--studio-lo) 76%,var(--bg) 100%)}

<script>
/* Loader: a real percentage. Downloads move it to 15, the 3D module reports the rest through
   window.__heroLoad(pct). The shell waits for window.__heroReady before its single ScrollTrigger refresh. */
(function () {
  var s = document.getElementById('hero');
  var html = document.documentElement;
  var settle;
  window.__heroReady = new Promise(function (r) { settle = r; });
  function ready() { html.classList.remove('hero-loading'); settle(); }
  if (!s) { ready(); return; }
  html.classList.add('hero-loading');
  setTimeout(ready, 15000); // never keep the page locked
  var num = s.querySelector('[data-ld]'), bar = s.querySelector('[data-ld-bar]');
  var target = 0, shown = 0, last = -1, waiters = [], raf = 0;
  function paint() {
    var v = Math.floor(shown);
    if (v !== last) { last = v; if (num) num.textContent = v; if (bar) bar.style.transform = 'scaleX(' + (v / 100) + ')'; }
  }
  function tick() {
    raf = 0;

      const f = 0;
      const o = i * 6;
      gPos[o] = _l.x; gPos[o + 1] = _l.y; gPos[o + 2] = _l.z;
      if (f > 0.001) { gPos[o + 3] = pt.hw.x; gPos[o + 4] = pt.hw.y; gPos[o + 5] = pt.hw.z; }
      else { gPos[o + 3] = _l.x; gPos[o + 4] = _l.y; gPos[o + 5] = _l.z; } // collapse unused segment
      gCol[o] = COL.steel.r * f; gCol[o + 1] = COL.steel.g * f; gCol[o + 2] = COL.steel.b * f;
      gCol[o + 3] = COL.accent.r * f * 0.35; gCol[o + 4] = COL.accent.g * f * 0.35; gCol[o + 5] = COL.accent.b * f * 0.35;
      if (pt.lbl) {
        const lo = STATIC ? 0 : (1 - smooth(0, 0.5, pt.t)) * ip;
        _v.copy(_w).project(camera);
        const x = (_v.x * 0.5 + 0.5) * view.w, y = (-_v.y * 0.5 + 0.5) * view.h;
        // skip a label whose text box would collide with one already placed this frame
        let hit = dk > 0 || _v.z >= 1 || x < 12 || y < 70 || y > view.h - 60 || (x < view.copyR && y > view.copyT && y < view.copyB);
        for (let j = 0; j < placed && !hit; j++) {
          if (Math.abs(lblBox[j * 2] - x) < 190 && Math.abs(lblBox[j * 2 + 1] - y) < 44) hit = true;
        }
        if (lo > 0.004 && !hit) {
          lblBox[placed * 2] = x; lblBox[placed * 2 + 1] = y; placed++;
          const flip = x > view.w - 200;
          if (flip !== pt.flip) { pt.lbl.classList.toggle('is-flip', flip); pt.flip = flip; }
          pt.lbl.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
          pt.lbl.style.opacity = lo.toFixed(3);
          pt.lblOn = true;
        } else if (pt.lblOn) {
          pt.lbl.style.opacity = '0';
          pt.lblOn = false;
        }
      }
    }
    /* hover label: pick the part under the cursor, tag it, light its wireframe in gold */
    const inside = !STATIC && dk === 0 && ptr.has && ptr.cx >= 0 && ptr.cy >= 0 && ptr.cx <= view.w && ptr.cy <= view.h && ip > 0.5;
    if (!inside) {
      if (hover) { showFres(hover, false); hover = null; hoverLbl.style.opacity = '0'; root.classList.remove('is-picking'); }
    } else if ((pickTick = (pickTick + 1) % 3) === 0) {
      ndc.set((ptr.cx / view.w) * 2 - 1, -(ptr.cy / view.h) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      let hit = null;
      for (const h of ray.intersectObjects(pickList, false)) {
        const hp = meshToPart.get(h.object);
        if (hp && hp.obj.visible) { hit = hp; break; }
      }
      if (hit !== hover) {
        showFres(hover, false);
        showFres(hit, true);
        hover = hit;
        if (hit) { hvB.textContent = hit.code + ' · ' + hit.d.name.replace(/ [LR]$/, ''); hvEm.textContent = hit.d.spec; }
        hoverLbl.style.opacity = hit ? '1' : '0';
        root.classList.toggle('is-picking', !!hit);
      }
    }
    if (hover) {
      hover.obj.localToWorld(_w.copy(hover.cLocal)).project(camera);
      const x = (_w.x * 0.5 + 0.5) * view.w, y = (-_w.y * 0.5 + 0.5) * view.h;
      const flip = x > view.w - 240;
      if (flip !== hoverFlip) { hoverLbl.classList.toggle('is-flip', flip); hoverFlip = flip; }
      hoverLbl.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
    }
    /* docked in the anatomy section: the component being read (hover first, then the selection) lights up */
    const hlId = docked && dock.secId === 'anatomy' ? (dock.pv || dock.sel) : null;
    if (hlId !== dock.hlId) {
      dock.hlParts.forEach((pt) => showFres(pt, false));
      dock.hlParts = hlId ? partsFor(hlId) : [];
      dock.hlParts.forEach((pt) => showFres(pt, true));
      dock.hlId = hlId;
      if (hlId) dock.pulse = 1;
    }
    dock.pulse = Math.max(0, dock.pulse - dt * 2.2);
    guide.visible = ip > 0.01;
    hoverK += ((hover || hlId ? 1 : 0) - hoverK) * (1 - Math.exp(-dt * 8));
    fresMat.uniforms.uK.value = hoverK * (1 + 0.8 * dock.pulse * dock.pulse);
    guideGeo.attributes.position.needsUpdate = true;
    guideGeo.attributes.color.needsUpdate = true;

    if (sparksAlive) {
      let any = false;
      const damp = Math.exp(-dt * 3);
      for (let k = 0; k < SPN; k++) {
        const i3 = k * 3;
        if (sLife[k] > 0) {
          any = true;
          sLife[k] -= dt;
          sVel[i3] *= damp; sVel[i3 + 1] = sVel[i3 + 1] * damp - dt * 0.6; sVel[i3 + 2] *= damp;
          sPos[i3] += sVel[i3] * dt; sPos[i3 + 1] += sVel[i3 + 1] * dt; sPos[i3 + 2] += sVel[i3 + 2] * dt;
          const f = Math.max(0, sLife[k] / sMax[k]);
          const c = f * f * (USE_POST ? 0.6 : 1.5);
          sCol[i3] = 1.0 * c; sCol[i3 + 1] = 0.8 * c; sCol[i3 + 2] = 0.48 * c;
        } else {
          sCol[i3] = sCol[i3 + 1] = sCol[i3 + 2] = 0;
        }
      }
      sparkGeo.attributes.position.needsUpdate = true;
      sparkGeo.attributes.color.needsUpdate = true;
      sparksAlive = any;
    }
    for (const g of glows) {
      if (g.userData.life <= 0) continue;
      g.userData.life = Math.max(0, g.userData.life - dt * 2.2);
      const lf = g.userData.life;
      g.scale.setScalar(0.06 + (1 - lf) * 0.32);
      g.material.opacity = lf * lf * (USE_POST ? 0.22 : 0.8);
      g.visible = lf > 0;
    }

    /* DOM: copy stage, HUD, readouts */
    let idx = 0;
    for (let i = 0; i < STAGE_AT.length; i++) if (p >= STAGE_AT[i]) idx = i;
    if (STATIC) idx = 0;
    if (idx !== stage) {
      stEls.forEach((el, i) => { el.classList.toggle('is-on', i === idx); el.classList.toggle('is-past', i < idx); });
      stepEls.forEach((el, i) => { el.classList.toggle('is-on', i === idx); el.classList.toggle('is-done', i < idx); });
      stLbl.textContent = String(idx).padStart(2, '0') + ' / 06';
      root.classList.toggle('is-complete', idx === STAGE_AT.length - 1);
      stage = idx;
    }
    const pct = Math.round(p * 100);
    if (pct !== lastPct) {
      pctEl.textContent = String(pct).padStart(3, '0');
      lastPct = pct;
      root.classList.toggle('is-scrolled', p > 0.015);
      root.classList.toggle('is-done', p > 0.97);
    }
    fillEl.style.transform = 'scaleX(' + p.toFixed(4) + ')';
  }

  /* ---------- loop, visibility, resize ---------- */
  const clock = new THREE.Clock();
  let running = false, raf = 0, inView = true, shadowTick = 0;
  function frame() {
    if (!running) return;
    raf = requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05);
    time += dt;
    update(dt);
    if (!renderer.shadowMap.autoUpdate && (++shadowTick % 6 === 0)) renderer.shadowMap.needsUpdate = true;
    draw();
  }
  function start() {
    if (running || STATIC) return;
    running = true;
    clock.getDelta();
    raf = requestAnimationFrame(frame);
  }
  function stop() {
    running = false;
    cancelAnimationFrame(raf);
  }
  function draw() { if (composer) composer.render(); else renderer.render(scene, camera); }
  function renderStatic() {
    update(0);
    draw();
  }

  function resize() {
    const w = Math.max(1, root.clientWidth), h = Math.max(1, root.clientHeight);
    view.w = w; view.h = h;
    if (dock.mode !== 'dock') renderer.setSize(w, h, false);
    const aspect = w / h;
    camera.aspect = aspect;
    camera.fov = aspect < 0.75 ? 32 : aspect < 1.1 ? 28 : 24;
    view.radK = aspect < 0.75 ? 1.14 : aspect < 1.1 ? 1.08 : 1;
    const narrow = w <= 760;
    view.narrow = narrow;
    mark.locked = false;
    view.bx = narrow ? 0 : -w * 0.16; view.by = narrow ? h * 0.13 : 0;
    camera.setViewOffset(w, h, view.bx, view.by, w, h);
    camera.updateProjectionMatrix();
    measureDock();
    if (dock.mode === 'fly') setMode('fly');
    if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); drawBg(w, h, narrow); }
    const rr = root.getBoundingClientRect(), cr = q('.h-copy').getBoundingClientRect();
    view.copyR = cr.right - rr.left + 24;
    view.copyT = cr.top - rr.top - 40;
    view.copyB = cr.bottom - rr.top + 40;
    if (!running) renderStatic();
  }
  /* compile shaders off the main thread where the driver allows it, counting ready programs for 86 → 96.
     Whatever is not ready in 4s (or in a background tab, where the status never resolves) compiles on the first draw. */
  if (!document.hidden) {
    try {
      let compiled = false;
      renderer.compileAsync(scene, camera).then(() => { compiled = true; }, () => { compiled = true; });
      const t0 = performance.now();
      while (!compiled && performance.now() - t0 < 4000) {
        const progs = renderer.info.programs || [];
        const ok = progs.filter((pr) => pr.isReady && pr.isReady()).length;
        load(86 + Math.round((10 * ok) / Math.max(1, progs.length)));
        await new Promise((r) => setTimeout(r, 50));
      }
    } catch (e) { /* first draw compiles instead */ }
  }
  load(96);
  await yieldFrame();
  resize();
  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(root);
  else window.addEventListener('resize', resize);

  if ('IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
      inView = entries[0].isIntersecting;
      // an open dock keeps the robot on screen after the hero has gone
      if (inView || (DOCK && dock.ready && !dock.min)) start(); else stop();
    }, { threshold: 0 }).observe(root);
  }
  start();

  /* ---------- scroll: pin + scrub ---------- */
  if (HAS_GSAP && !STATIC) {
    const { gsap, ScrollTrigger } = window;
    gsap.registerPlugin(ScrollTrigger);
    const st = ScrollTrigger.create({
      trigger: root,
      start: 'top top',
      end: () => '+=' + Math.round(window.innerHeight * 3.1),
      pin: true,
      scrub: true,
      anticipatePin: 1,
      invalidateOnRefresh: true,
      onUpdate: (self) => { target = Math.min(1, self.progress / HOLD); },
    });
    heroST = st;
    target = Math.min(1, st.progress / HOLD);
    /* stage rail: jump to the middle of each stage's scroll window */
    stepEls.forEach((li, i) => {
      const b = li.querySelector('button');
      if (!b) return;
      b.addEventListener('click', () => {
        const from = STAGE_AT[i], to = i + 1 < STAGE_AT.length ? STAGE_AT[i + 1] : 1;
        const f = i === 0 ? 0 : Math.min(0.99, from + (to - from) * 0.45);
        const prog = i === STAGE_AT.length - 1 ? (1 + HOLD) / 2 : f * HOLD; // last stage: middle of the hold
        window.scrollTo({ top: Math.round(st.start + (st.end - st.start) * prog), behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      });
    });
    /* the shell runs ScrollTrigger.sort() + refresh() once after load and fonts */

    /* intro: headline is already on screen (CSS); the 3D stage fades in, grid and parts unfold in 0.7s */
    await load.finish();
    intro.load = 100;
    root.classList.add('is-loaded', 'is-intro-done');
    load.ready();
    if (DOCK) { dock.ready = true; track(); if (!inView && !dock.min) start(); }
    gsap.timeline()
      .to(intro, { grid: 1, duration: 0.7, ease: 'power3.inOut' })
      .to(intro, { parts: 1, duration: 0.7, ease: 'power2.out' }, '<0.1');
  } else {
    renderStatic();
    await load.finish();
    root.classList.add('is-loaded', 'is-intro-done');
    load.ready();
  }
}
</script>
