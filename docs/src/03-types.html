<style>
#types{
  position:relative;
  background:var(--bg-2);
  color:var(--text);
  font-family:var(--f-body);
  overflow-x:clip;
}
#types .ty-title{word-break:keep-all}
#types .ty-title > span{display:inline-block}
#types .ty-lead{word-break:keep-all}

/* ---------- plate grid templates ---------- */
#types .ty-plate{
  --c-fig:96px;--c-tg:56px;
  margin-top:clamp(40px,5vw,64px);
  border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);
}
#types .ty-hd2,
#types .ty-row,
#types .ty-sum{
  display:grid;
  grid-template-columns:var(--c-fig) minmax(0,1.05fr) minmax(0,1fr) minmax(0,2.9fr) var(--c-tg);
  grid-template-areas:"fig name ex lad tg";
}

/* header row 1: plate caption + bracket over the ladder */
#types .ty-hd1{
  display:grid;
  grid-template-columns:var(--c-fig) minmax(0,1.05fr) minmax(0,1fr) minmax(0,2.9fr) var(--c-tg);
  align-items:end;padding:16px 0 10px;
}
#types .ty-cap{grid-column:1/4;margin:0;font-family:var(--f-display);font-size:19px;font-weight:700;color:var(--text);letter-spacing:-.02em}
#types .ty-sup{grid-column:4/5;margin:0;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;color:var(--muted)}
#types .ty-sup i{flex:1;height:1px;position:relative;background:var(--line-2)}
#types .ty-sup i::after{content:"";position:absolute;right:-1px;top:-4px;border:4.5px solid transparent;border-left:7px solid var(--line-2);border-right:0}

/* header row 2: column labels */
#types .ty-hd2{border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
#types .ty-hd2 > span{padding:10px 0 10px}
#types .ty-h-fig{grid-area:fig}
#types .ty-h-name{grid-area:name}
#types .ty-h-ex{grid-area:ex}
#types .ty-h-lad{grid-area:lad;display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr));padding:0!important}
#types .ty-h-lad > span{
  display:flex;align-items:baseline;gap:6px;padding:10px 10px 10px 12px;border-left:1px solid var(--line);
  font-size:14px;color:var(--muted);word-break:keep-all;line-height:1.35;
}
#types .ty-h-lad b{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}

/* ---------- rows ---------- */
#types .ty-rows{margin:0;padding:0;list-style:none}
#types .ty-item{border-top:1px solid var(--line)}
#types .ty-item:first-child{border-top-color:var(--line-2)}
#types .ty-h{margin:0;font:inherit}
#types .ty-row{
  width:100%;margin:0;padding:0;border:0;border-radius:0;background:transparent;color:inherit;
  font:inherit;text-align:left;cursor:pointer;align-items:stretch;
  transition:background-color .25s var(--ease);
}
#types .ty-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@media (hover:hover){
  #types .ty-row:hover{background:color-mix(in srgb,var(--surface) 55%,transparent)}
  #types .ty-row:hover .ty-tg{border-color:var(--muted)}
}
#types .ty-item.is-open .ty-row{background:var(--surface)}

#types .ty-fig{grid-area:fig;display:flex;align-items:center;padding:10px 0}
#types .ty-fig svg{display:block;width:58px;height:58px;overflow:visible}
#types .ty-fig svg *{fill:none;stroke:var(--text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#types .ty-fig svg .j{fill:var(--bg-2);stroke:var(--text)}
#types .ty-item.is-open .ty-fig svg .j,
#types .ty-row:hover .ty-fig svg .j{fill:var(--surface)}
#types .ty-fig svg .g{stroke:var(--line-2);stroke-width:1}

#types .ty-name{grid-area:name;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:10px 20px 10px 0;min-width:0}
#types .ty-ko{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.3;color:var(--text);word-break:keep-all}
#types .ty-en{font-family:var(--f-mono);font-size:13px;font-weight:400;line-height:1.45;letter-spacing:.01em;color:var(--dim)}

#types .ty-ex{grid-area:ex;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:10px 20px 10px 0;min-width:0;font-size:15px;line-height:1.42;color:var(--muted)}
#types .ty-ex > span{word-break:keep-all}
#types .ty-ex .ty-more{margin-left:6px;font-style:normal;font-size:13px;color:var(--dim);white-space:nowrap}

/* ladder */
#types .ty-lad{grid-area:lad;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
#types .ty-s{position:relative;border-left:1px solid var(--line);min-height:40px}
#types .ty-s::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--line-2);opacity:.75}
#types .ty-s.past::before,
#types .ty-s.now::before{border-top:2px solid var(--line-2);margin-top:-1px;opacity:1}
#types .ty-s.now::before{right:50%}
#types .ty-s.past::after{
  content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;
  border-radius:50%;background:var(--bg-2);border:2px solid var(--line-2);box-sizing:border-box;
}
#types .ty-item.is-open .ty-s.past::after,
#types .ty-row:hover .ty-s.past::after{background:var(--surface)}
#types .ty-s.now > b{
  position:absolute;left:8px;right:8px;top:50%;height:38px;margin-top:-19px;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:var(--accent-ink);border-radius:2px;
  font-size:15px;font-weight:600;line-height:1;white-space:nowrap;transform-origin:left center;
}

/* toggle */
#types .ty-tgc{grid-area:tg;display:flex;align-items:center;justify-content:flex-end;border-left:1px solid var(--line)}
#types .ty-tg{position:relative;display:block;width:26px;height:26px;border:1px solid var(--line-2);border-radius:2px;transition:border-color .2s}
#types .ty-tg::before,#types .ty-tg::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:1.5px;margin:-.75px 0 0 -5px;background:var(--muted);transition:transform .3s var(--ease)}
#types .ty-tg::after{transform:rotate(90deg)}
#types .ty-item.is-open .ty-tg::after{transform:rotate(0)}

/* ---------- detail ---------- */
#types .ty-d{
  display:grid;grid-template-rows:0fr;visibility:hidden;
  transition:grid-template-rows .45s var(--ease),visibility 0s linear .45s;
  background:var(--surface);
}
#types .ty-item.is-open .ty-d{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .45s var(--ease),visibility 0s}
#types .ty-d-in{overflow:hidden;min-height:0}
#types .ty-d-grid{
  display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.8fr) minmax(0,1.25fr);gap:0 40px;
  margin:0 var(--c-tg) 0 var(--c-fig);padding:18px 0 30px;border-top:1px solid var(--line);
}
#types .ty-k{display:block;margin:0 0 10px;font-size:13px;font-weight:600;color:var(--dim)}
#types .ty-k em{font-style:normal;font-weight:600;margin-left:4px;color:var(--accent-2)}
#types .ty-d p{margin:0;font-size:16px;line-height:1.75;color:var(--text);word-break:keep-all}
#types .ty-d .ty-note{color:var(--muted)}
#types .ty-d ul{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
#types .ty-d li{padding:7px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.45;color:var(--text);word-break:keep-all}

/* ---------- tally + foot ---------- */
#types .ty-sum{border-top:1px solid var(--line-2)}
#types .ty-sum-k{grid-column:2/4;padding:12px 0;font-size:14px;font-weight:600;color:var(--muted);align-self:center}
#types .ty-sum-lad{grid-area:lad;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
#types .ty-sum-lad span{
  padding:10px 12px;border-left:1px solid var(--line);
  font-family:var(--f-mono);font-size:16px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;
}
#types .ty-sum-lad span.z{color:var(--dim)}
#types .ty-sum-lad span small{font-family:var(--f-body);font-size:13px;color:var(--dim);margin-left:2px}
#types .ty-sum-tg{grid-area:tg;border-left:1px solid var(--line)}

#types .ty-foot{
  display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;
  padding:14px 0;border-top:1px solid var(--line);
}
#types .ty-legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0;padding:0;list-style:none}
#types .ty-legend li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
#types .ty-legend i{display:block;width:26px;height:12px;position:relative}
#types .ty-legend .lg-now{background:var(--accent);border-radius:2px;width:22px}
#types .ty-legend .lg-past::before{content:"";position:absolute;left:0;right:0;top:5px;border-top:2px solid var(--line-2)}
#types .ty-legend .lg-past::after{content:"";position:absolute;left:9px;top:2px;width:8px;height:8px;border-radius:50%;box-sizing:border-box;border:2px solid var(--line-2);background:var(--bg-2)}
#types .ty-legend .lg-next::before{content:"";position:absolute;left:0;right:0;top:6px;border-top:1px dashed var(--line-2)}
#types .ty-all{
  margin-left:auto;padding:9px 16px;border:1px solid var(--line-2);border-radius:2px;background:transparent;
  font:600 14px/1 var(--f-body);color:var(--text);cursor:pointer;transition:background-color .2s,border-color .2s;
}
#types .ty-all:hover{background:var(--surface);border-color:var(--muted)}
#types .ty-all:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- tablet ---------- */
@media (max-width:1100px){
  #types .ty-plate{--c-fig:80px;--c-tg:48px}
  #types .ty-hd1,
  #types .ty-hd2,
  #types .ty-row,
  #types .ty-sum{grid-template-columns:var(--c-fig) minmax(0,1fr) minmax(0,1.7fr) var(--c-tg)}
  #types .ty-row{grid-template-areas:"fig name lad tg" "fig ex lad tg"}
  #types .ty-hd2,#types .ty-sum{grid-template-areas:"fig name lad tg"}
  #types .ty-cap{grid-column:1/3}
  #types .ty-sup{grid-column:3/4}
  #types .ty-h-ex{display:none}
  #types .ty-name{justify-content:flex-end;padding-bottom:4px}
  #types .ty-ex{display:block;justify-content:flex-start;padding-top:0;font-size:14px}
  #types .ty-ex > span{display:inline}
  #types .ty-ex > span + span::before{content:"\00a0· ";color:var(--dim)}
  #types .ty-sum-k{grid-column:2/3}
  #types .ty-h-lad > span{font-size:13px;padding:10px 6px 10px 8px;flex-direction:column;gap:0}
  #types .ty-s.now > b{left:5px;right:5px;font-size:14px}
  #types .ty-d-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px 32px}
  #types .ty-d-grid > div:first-child{grid-column:1/-1}
}

/* ---------- phone ---------- */
@media (max-width:760px){
  #types .ty-plate{--c-fig:60px;--c-tg:36px}
  #types .ty-hd1{grid-template-columns:minmax(0,1fr);padding:14px 0 10px}
  #types .ty-cap{grid-column:1/-1;font-size:18px}
  #types .ty-sup{display:none}
  #types .ty-hd2{grid-template-columns:minmax(0,1fr);grid-template-areas:"lad"}
  #types .ty-h-fig,#types .ty-h-name{display:none}
  #types .ty-h-lad > span{padding:8px 4px 8px 6px;font-size:13px;line-height:1.3}
  #types .ty-h-lad > span:last-child{border-right:1px solid var(--line)}

  #types .ty-row{
    grid-template-columns:var(--c-fig) minmax(0,1fr) var(--c-tg);
    grid-template-areas:"fig name tg" "ex ex ex" "lad lad lad";
    padding:6px 0 16px;
  }
  #types .ty-fig{padding:8px 0}
  #types .ty-fig svg{width:52px;height:52px}
  #types .ty-name{justify-content:center;padding:8px 8px 8px 0}
  #types .ty-ko{font-size:19px}
  #types .ty-ex{padding:0 0 10px;font-size:14px;line-height:1.55}
  #types .ty-tgc{border-left:0}
  #types .ty-lad{border-right:1px solid var(--line)}
  #types .ty-s{min-height:34px}
  #types .ty-s.now > b{left:3px;right:3px;height:30px;margin-top:-15px;font-size:13px;letter-spacing:-.01em}

  #types .ty-d-grid{grid-template-columns:minmax(0,1fr);gap:20px;margin:0 16px;padding:16px 0 22px}
  #types .ty-d-grid > div:first-child{grid-column:auto}
  #types .ty-item.is-open .ty-row{background:var(--surface)}

  #types .ty-sum{grid-template-columns:minmax(0,1fr);grid-template-areas:"k" "lad"}
  #types .ty-sum-k{grid-column:1/-1;padding:12px 0 6px}
  #types .ty-sum-lad{border-right:1px solid var(--line)}
  #types .ty-sum-lad span{padding:8px 6px;font-size:15px}
  #types .ty-sum-lad span small{display:none}
  #types .ty-sum-tg{display:none}

  #types .ty-all{margin-left:0}
}

@media (prefers-reduced-motion:reduce){
  #types .ty-d,#types .ty-item.is-open .ty-d,#types .ty-tg::before,#types .ty-tg::after,#types .ty-row{transition:none!important}
}
</style>

<script>
(function(){
  var root=document.getElementById('types');
  if(!root) return;
  var data;
  try{ data=JSON.parse(document.getElementById('types-data').textContent); }catch(e){ return; }

  var LV=['','연구','파일럿','초기 상용','상용 확산','성숙 시장'];

  /* Silhouettes share one 64-unit frame, one ground line (y=58.5) and one stroke weight.
     Each body is translated so it stands on that ground. */
  var G='<path class="g" d="M4 58.5h56"/>';
  var ICONS={
    'humanoid':
      '<circle cx="32" cy="9.5" r="5"/>'+
      '<path d="M24 18h16l2 19H22z"/>'+
      '<path d="M29 24h6"/>'+
      '<path d="M24 19l-6 14 2 8"/>'+
      '<path d="M40 19l6 14-2 8"/>'+
      '<path d="M27 37l-2 12-1 9h-4"/>'+
      '<path d="M37 37l2 12 1 9h4"/>',
    'wheeled-humanoid':
      '<circle cx="32" cy="8.5" r="5"/>'+
      '<path d="M25 16h14l1 16H24z"/>'+
      '<path d="M25 17l-7 11 3 7"/>'+
      '<path d="M39 17l7 11-3 7"/>'+
      '<path d="M30 32v8M34 32v8"/>'+
      '<rect x="17" y="40" width="30" height="10" rx="2"/>'+
      '<circle class="j" cx="24" cy="54.5" r="4"/>'+
      '<circle class="j" cx="40" cy="54.5" r="4"/>',
    'quadruped':
      '<g transform="translate(0 4.5)">'+
      '<rect x="14" y="21" width="32" height="12" rx="3"/>'+
      '<path d="M46 24l7-3 5 4-4 5h-8"/>'+
      '<path d="M18 33l-4 10 4 11"/>'+
      '<path d="M25 33l-4 10 4 11"/>'+
      '<path d="M37 33l4 10-4 11"/>'+
      '<path d="M43 33l4 10-4 11"/>'+
      '</g>',
    'cobot':
      '<g transform="translate(0 1.5)">'+
      '<rect x="18" y="48" width="14" height="9" rx="1.5"/>'+
      '<path d="M25 48V37"/>'+
      '<path d="M27.5 31l11-9.5"/>'+
      '<path d="M43.5 21.5l5.5 7"/>'+
      '<path d="M46.5 34h8M47.5 34v6M53.5 34v6"/>'+
      '<circle class="j" cx="25" cy="33.5" r="3.5"/>'+
      '<circle class="j" cx="41" cy="19" r="3.5"/>'+
      '<circle class="j" cx="50.5" cy="30.5" r="2.2"/>'+
      '</g>',
    'industrial-arm':
      '<g transform="translate(0 .5)">'+
      '<path d="M13 58v-6h24v6"/>'+
      '<path d="M18 52l3-9h8l3 9"/>'+
      '<path d="M22 36l9-19 7 3.5-9 19"/>'+
      '<path d="M40 14l14 3.5-1.2 5.5-14-3"/>'+
      '<path d="M54.5 21v8M51 29h7"/>'+
      '<circle class="j" cx="25" cy="39" r="4.5"/>'+
      '<circle class="j" cx="36" cy="16.5" r="4.5"/>'+
      '</g>',
    'amr':
      '<g transform="translate(0 3)">'+
      '<path d="M16 38V15M48 38V15M16 15h32M16 26.5h32"/>'+
      '<rect x="10" y="38" width="44" height="11" rx="2"/>'+
      '<path d="M57.5 39.5a7 7 0 0 1 0 8"/>'+
      '<circle class="j" cx="19" cy="52.5" r="3"/>'+
      '<circle class="j" cx="45" cy="52.5" r="3"/>'+
      '</g>',
    'surgical':
      '<g transform="translate(0 2)">'+
      '<path d="M32 5v10"/>'+
      '<path d="M17 15h30"/>'+
      '<path d="M20 15l-5 15 6 10"/>'+
      '<path d="M32 15v19"/>'+
      '<path d="M44 15l5 15-6 10"/>'+
      '<path d="M21 40l3 7M32 34v13M43 40l-3 7"/>'+
      '<path d="M14 50h36M20 50v6.5M44 50v6.5"/>'+
      '</g>',
    'exoskeleton':
      '<g transform="translate(0 .5)">'+
      '<circle cx="32" cy="9" r="4.5"/>'+
      '<path d="M25 18h14M32 18v20M24 38h16"/>'+
      '<path d="M25 18l-4 15M39 18l4 15"/>'+
      '<path d="M26 38l-1 10 1 10M38 38l1 10-1 10"/>'+
      '<circle class="j" cx="32" cy="38" r="2.6"/>'+
      '<rect class="j" x="21.5" y="44" width="5" height="7" rx="1.2"/>'+
      '<rect class="j" x="37.5" y="44" width="5" height="7" rx="1.2"/>'+
      '</g>'
  };

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function mat(t){return Math.max(1,Math.min(5,+t.maturity||1));}

  [].forEach.call(root.querySelectorAll('[data-ty-count]'),function(el){el.textContent=data.length;});

  /* stage header */
  var stH='';
  for(var s=1;s<=5;s++) stH+='<span><b>'+s+'</b>'+LV[s]+'</span>';
  root.querySelector('[data-ty-stages]').innerHTML=stH;

  /* rows, ordered by maturity (stable) so the ladder reads top to bottom */
  var rows=data.map(function(t,i){return {t:t,i:i};})
    .sort(function(a,b){return mat(a.t)-mat(b.t)||a.i-b.i;})
    .map(function(o){return o.t;});

  var list=root.querySelector('[data-ty-rows]');
  list.innerHTML=rows.map(function(t){
    var m=mat(t), id=esc(t.id), ex=t.examples||[];
    var lad='';
    for(var s=1;s<=5;s++){
      lad+= s<m ? '<span class="ty-s past"></span>'
          : s===m ? '<span class="ty-s now"><b>'+LV[s]+'</b></span>'
          : '<span class="ty-s"></span>';
    }
    var top=ex.slice(0,3), more=ex.length-top.length;
    var shown=top.map(function(x,k){
      return '<span>'+esc(x)+(more>0&&k===top.length-1?'<em class="ty-more">외 '+more+'</em>':'')+'</span>';
    }).join('');
    return '<li class="ty-item" data-id="'+id+'">'+
      '<h3 class="ty-h"><button type="button" class="ty-row" id="ty-b-'+id+'" aria-expanded="false" aria-controls="ty-d-'+id+'">'+
        '<span class="ty-fig" aria-hidden="true"><svg viewBox="0 0 64 64">'+G+(ICONS[t.id]||'')+'</svg></span>'+
        '<span class="ty-name"><span class="ty-ko">'+esc(t.name_ko)+'</span><span class="ty-en" lang="en">'+esc(t.name_en)+'</span></span>'+
        '<span class="ty-ex">'+shown+'</span>'+
        '<span class="ty-lad" aria-hidden="true">'+lad+'</span>'+
        '<span class="sr-only">, 상용 성숙도 5단계 중 '+m+'단계 '+LV[m]+'</span>'+
        '<span class="ty-tgc" aria-hidden="true"><span class="ty-tg"></span></span>'+
      '</button></h3>'+
      '<div class="ty-d" id="ty-d-'+id+'" role="region" aria-labelledby="ty-b-'+id+'"><div class="ty-d-in"><div class="ty-d-grid">'+
        '<div><span class="ty-k">정의</span><p>'+esc(t.desc_ko)+'</p></div>'+
        '<div><span class="ty-k">대표 제품·기업<em>'+ex.length+'</em></span><ul>'+
          ex.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>'+
        '<div><span class="ty-k">단계 판단<em>'+m+'단계 · '+LV[m]+'</em></span><p class="ty-note">'+esc(t.maturity_note_ko)+'</p></div>'+
      '</div></div></div>'+
    '</li>';
  }).join('');

  /* tally per stage */
  var cnt=[0,0,0,0,0,0];
  data.forEach(function(t){cnt[mat(t)]++;});
  var sum='<span class="ty-sum-k">단계별 유형 수</span><span class="ty-sum-lad" aria-hidden="true">';
  var srSum=[];
  for(var k=1;k<=5;k++){
    sum+='<span'+(cnt[k]?'':' class="z"')+'>'+cnt[k]+'<small>개</small></span>';
    srSum.push(LV[k]+' '+cnt[k]+'개');
  }
  sum+='</span><span class="ty-sum-tg" aria-hidden="true"></span><span class="sr-only">'+srSum.join(', ')+'</span>';
  root.querySelector('[data-ty-sum]').innerHTML=sum;

  /* accordion */
  var items=[].slice.call(list.querySelectorAll('.ty-item'));
  var btns=items.map(function(li){return li.querySelector('.ty-row');});
  var allBtn=root.querySelector('[data-ty-all]');
  var rt=0;
  function refresh(){
    clearTimeout(rt);
    rt=setTimeout(function(){ window.ScrollTrigger && ScrollTrigger.refresh(); },480);
  }
  function setOpen(li,open){
    li.classList.toggle('is-open',open);
    li.querySelector('.ty-row').setAttribute('aria-expanded',open?'true':'false');
  }
  function syncAll(){
    var all=items.every(function(li){return li.classList.contains('is-open');});
    allBtn.textContent=all?'모두 접기':'모두 펼치기';
    allBtn.setAttribute('aria-pressed',all?'true':'false');
  }
  btns.forEach(function(b,i){
    b.addEventListener('click',function(){
      setOpen(items[i],!items[i].classList.contains('is-open'));
      syncAll(); refresh();
    });
    b.addEventListener('keydown',function(e){
      var j=-1;
      if(e.key==='ArrowDown') j=Math.min(btns.length-1,i+1);
      else if(e.key==='ArrowUp') j=Math.max(0,i-1);
      else if(e.key==='Home') j=0;
      else if(e.key==='End') j=btns.length-1;
      if(j<0) return;
      e.preventDefault(); btns[j].focus();
    });
  });
  allBtn.addEventListener('click',function(){
    var open=allBtn.getAttribute('aria-pressed')!=='true';
    items.forEach(function(li){setOpen(li,open);});
    syncAll(); refresh();
  });

  /* entrance: rows settle, then each current-stage block draws from the left */
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var gsap=window.gsap, ST=window.ScrollTrigger;
  if(reduce || !gsap || !ST) return;
  gsap.registerPlugin(ST);
  var blocks=list.querySelectorAll('.ty-s.now > b');
  var tl=gsap.timeline({scrollTrigger:{trigger:list,start:'top 80%',once:true}});
  tl.from(items,{opacity:0,y:14,duration:.6,ease:'power2.out',stagger:.05})
    .from(blocks,{scaleX:0,duration:.55,ease:'power3.out',stagger:.06},.25);
})();
</script>
