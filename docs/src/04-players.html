  #players .pl-ltable tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  #players .pl-ltable tr.is-y{border-top:1px solid var(--line-2)}
  #players .pl-ltable td,#players .pl-ltable tr.is-y td{padding:0;border:0}
  #players .pl-ltable td:nth-child(1){width:auto}
  #players .pl-ltable td:nth-child(2){width:auto}
  #players .pl-ltable td:nth-child(3){grid-column:1 / -1;margin-top:6px}
  #players .pl-ltable td:nth-child(4){grid-column:3;grid-row:1;width:auto}
}
@media (max-width:420px){
  #players .pl-maker span{display:block;margin:2px 0 0}
  #players .pl-specs tbody th{width:44%;padding-right:12px}
}
@media (prefers-reduced-motion:reduce){
  #players *,#players *::before,#players *::after{transition:none!important;animation:none!important}
}
</style>

<script>
(function(){
  var root=document.getElementById('players');
  if(!root) return;
  var raw;
  try{ raw=JSON.parse(document.getElementById('players-data').textContent); }catch(e){ return; }
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var gsap=window.gsap, ST=window.ScrollTrigger;
  var anim=!!gsap&&!reduce;
  function q(s){return root.querySelector(s);}

  /* ---------- helpers ---------- */
  var SVGNS='http://www.w3.org/2000/svg';
  function h(tag,attrs,kids){
    var el=document.createElement(tag);
    if(attrs) for(var k in attrs){
      var v=attrs[k]; if(v==null||v===false) continue;
      if(k==='text') el.textContent=v;
      else el.setAttribute(k,v===true?'':v);
    }
    (kids||[]).forEach(function(c){ if(c!=null) el.appendChild(typeof c==='string'?document.createTextNode(c):c); });
    return el;
  }
  function icon(path,vb,filled){
    var s=document.createElementNS(SVGNS,'svg');
    s.setAttribute('viewBox',vb||'0 0 12 12');s.setAttribute('aria-hidden','true');s.setAttribute('focusable','false');
    var p=document.createElementNS(SVGNS,'path');p.setAttribute('d',path);
    if(!filled){p.setAttribute('fill','none');p.setAttribute('stroke','currentColor');p.setAttribute('stroke-width','1.3');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');}
    s.appendChild(p);return s;
  }
  function extIcon(){return icon('M4.5 2.5h5v5M9.5 2.5L2.5 9.5');}
  function playIcon(){return icon('M0 0L10 5.5L0 11Z','0 0 10 11',true);}
  function ym(d){return String(d).replace('-','.');}
  function ymd(d){return String(d).replace(/-/g,'.');}
  function dur(s){
    s=Math.max(0,Math.round(+s||0));
    var hh=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;
    var p=function(n){return (n<10?'0':'')+n;};
    return hh?hh+':'+p(mm)+':'+p(ss):mm+':'+p(ss);
  }
  function views(n){
    n=+n||0;
    if(n>=1e8) return (Math.round(n/1e7)/10).toString().replace(/\.0$/,'')+'억';
    if(n>=1e4) return (Math.round(n/1e3)/10).toString().replace(/\.0$/,'')+'만';
    return n.toLocaleString('ko-KR');
  }
  function host(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return '';}}
  function num(v){var m=String(v).match(/\d+(?:[.,]\d+)*/);return m?m[0].replace(/,/g,''):null;}
  /* spec value: numbers with their units set in mono tabular figures, words stay in the body face */
  var NUM_RE=/(?:US\$)?[-±]?\d[\d.,]*(?:~-?\d[\d.,]*)?(?:K|%|mAh|mm|cm|m\/s|kg|lb|ft|in|°C|°|dB|kW|Wh|m|g)?/g;
  function specValue(td,v){
    v=String(v);
    if(!/\d/.test(v)){td.className='is-text';td.textContent=v;return;}
    var last=0,m;NUM_RE.lastIndex=0;
    while((m=NUM_RE.exec(v))){
      if(m.index>last) td.appendChild(document.createTextNode(v.slice(last,m.index)));
      td.appendChild(h('span',{'class':'n',text:m[0]}));
      last=m.index+m[0].length;
      if(!m[0].length) NUM_RE.lastIndex++;
    }
    if(last<v.length) td.appendChild(document.createTextNode(v.slice(last)));
  }

  /* ---------- merge (같은 id는 하나로 합침) ---------- */
  var list=[],byId={};
  [].concat((raw.west&&raw.west.companies)||[],(raw.asia&&raw.asia.companies)||[]).forEach(function(c){
    var cur=byId[c.id];
    if(!cur){
      cur={id:c.id,name:c.name,name_ko:c.name_ko,country:c.country,flagship:c.flagship,tagline_ko:c.tagline_ko,summary_ko:c.summary_ko,
        specs:(c.specs||[]).slice(),milestones:(c.milestones||[]).slice(),videos:(c.videos||[]).slice()};
      byId[c.id]=cur;list.push(cur);return;
    }
    var dates={};cur.milestones.forEach(function(m){dates[m.date]=1;});
    (c.milestones||[]).forEach(function(m){if(!dates[m.date]) cur.milestones.push(m);});
    var vids={};cur.videos.forEach(function(v){vids[v.id]=1;});
    (c.videos||[]).forEach(function(v){if(!vids[v.id]){vids[v.id]=1;cur.videos.push(v);}});
    var labels={},nums={};
    cur.specs.forEach(function(s){labels[s.label_ko]=1;var n=num(s.value);if(n) nums[n]=1;});
    (c.specs||[]).forEach(function(s){
      if(labels[s.label_ko]) return;
      var n=num(s.value); if(n&&nums[n]) return;
      cur.specs.push(s);labels[s.label_ko]=1;if(n) nums[n]=1;
    });
  });
  /* country groups: primary country first (미국·노르웨이 → 미국), order 미국, 중국, then data order */
  var groups=[],gBy={};
  list.forEach(function(c){
    c.group=/미국/.test(c.country)?'미국':/중국/.test(c.country)?'중국':String(c.country||'기타').split('·')[0];
    c.milestones.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
    c.videos.sort(function(a,b){return a.upload_date<b.upload_date?1:a.upload_date>b.upload_date?-1:0;});
    if(!gBy[c.group]){gBy[c.group]={k:c.group,items:[]};groups.push(gBy[c.group]);}
    gBy[c.group].items.push(c);
  });
  var RANK={'미국':0,'중국':1};
  groups.sort(function(a,b){var ra=a.k in RANK?RANK[a.k]:9,rb=b.k in RANK?RANK[b.k]:9;return ra-rb;});
  var order=[];groups.forEach(function(g){g.items.forEach(function(c){order.push(c);});});

  var totalVideos=list.reduce(function(a,c){return a+c.videos.length;},0);
  var totalMs=list.reduce(function(a,c){return a+c.milestones.length;},0);
  var genEl=q('[data-pl-generated]'),gen=(raw.west&&raw.west.generated)||(raw.asia&&raw.asia.generated)||'';
  if(genEl&&gen) genEl.textContent=gen;
  var stats={companies:order.length,videos:totalVideos,milestones:totalMs};
  root.querySelectorAll('[data-pl-stat]').forEach(function(el){el.textContent=stats[el.getAttribute('data-pl-stat')]||0;});

  /* ---------- index ---------- */
  var indexEl=q('[data-pl-index]'),sheetEl=q('[data-pl-sheet]'),liveEl=q('[data-pl-live]');
  var state={id:order[0]&&order[0].id};
  groups.forEach(function(g,gi){
    var gid='pl-g-'+gi;
    var ul=h('ul',{'class':'pl-cos'});
    g.items.forEach(function(c){
      var b=h('button',{type:'button','class':'pl-co','data-id':c.id,'aria-pressed':'false','aria-controls':'pl-sheet'},[
        h('b',{text:c.name}),h('small',{text:c.flagship||''})]);
      b.addEventListener('click',function(){select(c.id,{scroll:true});});
      ul.appendChild(h('li',null,[b]));
    });
    indexEl.appendChild(h('div',{'class':'pl-row',role:'group','aria-labelledby':gid},[
      h('h3',{'class':'pl-g',id:gid},[g.k,h('span',{text:String(g.items.length),'aria-label':g.items.length+'곳'})]),ul]));
  });
  /* arrow keys walk the index in reading order; Home/End jump */
  indexEl.addEventListener('keydown',function(e){
    var btns=[].slice.call(indexEl.querySelectorAll('.pl-co')),i=btns.indexOf(document.activeElement);
    if(i<0) return;
    var to=null;
    if(e.key==='ArrowRight'||e.key==='ArrowDown') to=Math.min(btns.length-1,i+1);
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp') to=Math.max(0,i-1);
    else if(e.key==='Home') to=0;
    else if(e.key==='End') to=btns.length-1;
    if(to==null) return;
    e.preventDefault();btns[to].focus();
  });

  /* ---------- spec sheet ---------- */
  function scrollToSheet(){
    var navH=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--nav-h'))||64;
    var top=sheetEl.getBoundingClientRect().top+window.pageYOffset-navH-16;
    window.scrollTo({top:top,behavior:reduce?'auto':'smooth'});
  }

  function playVideo(media,v){
    var f=h('iframe',{
      src:'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v.id)+'?autoplay=1&rel=0',
      title:v.title,allow:'autoplay; encrypted-media; picture-in-picture',allowfullscreen:true,
      referrerpolicy:'strict-origin-when-cross-origin'
    });
    media.textContent='';media.appendChild(f);
    var card=media.closest('.pl-vid');if(card){card.classList.add('is-wide');if(ST) requestAnimationFrame(function(){ST.refresh();});}
    try{f.focus();}catch(e){}
  }

  function videoCard(v){
    var watch='https://www.youtube.com/watch?v='+encodeURIComponent(v.id);
    var embeddable=v.embeddable!==false;
    var img=h('img',{src:'https://i.ytimg.com/vi/'+encodeURIComponent(v.id)+'/hqdefault.jpg',alt:'',loading:'lazy',decoding:'async'});
    img.addEventListener('error',function(){img.style.display='none';});
    var btn=h('button',{type:'button','class':'pl-vplay','aria-label':embeddable?'이 자리에서 재생: '+v.title:v.title+' (YouTube에서만 재생)',disabled:!embeddable},[
      img,h('span',{'class':'pl-vtag','aria-hidden':'true'},embeddable?[playIcon(),'재생 '+dur(v.duration_sec)]:['YouTube 전용 · '+dur(v.duration_sec)])
    ]);
    var media=h('div',{'class':'pl-vmedia'},[btn]);
    if(embeddable) btn.addEventListener('click',function(){playVideo(media,v);});
    var meta=h('p',{'class':'pl-vmeta'},[
      h('span',{text:ymd(v.upload_date)}),
      h('span',{text:dur(v.duration_sec)}),
      v.views?h('span',{text:'조회 '+views(v.views)}):null,
      v.channel?h('span',{text:v.channel}):null
    ]);
    return h('article',{'class':'pl-vid'},[media,h('div',{'class':'pl-vbody'},[
      h('h5',{'class':'pl-vt',text:v.title}),meta,
      v.note_ko?h('p',{'class':'pl-vnote',text:v.note_ko}):null,
      h('div',{'class':'pl-vfoot'},[h('a',{'class':'pl-ext',href:watch,target:'_blank',rel:'noopener'},['YouTube에서 보기',extIcon()])])
    ])]);
  }

  function renderSheet(c){
    sheetEl.textContent='';
    sheetEl.setAttribute('aria-labelledby','pl-sheet-title');
    /* head: identity left, title block right */
    var id=h('div',{'class':'pl-id'},[
      h('h3',{'class':'pl-h',id:'pl-sheet-title'},[
        h('span',{'class':'pl-maker',text:c.name}),
        h('span',{'class':'pl-model'},[h('span',{'class':'sr-only',text:'대표 모델 '}),c.flagship||c.name])
      ]),
      c.tagline_ko?h('p',{'class':'pl-tagline',text:c.tagline_ko}):null
    ]);
    function cell(dt,dd,mono){return h('div',null,[h('dt',{text:dt}),h('dd',{'class':mono?'is-mono':null,text:dd})]);}
    var span=c.milestones.length?ym(c.milestones[0].date)+(c.milestones.length>1?' ~ '+ym(c.milestones[c.milestones.length-1].date):''):'';
    var tb=h('dl',{'class':'pl-tb'},[
      cell('국가',c.country||''),
      cell('한글 표기',c.name_ko||c.name),
      cell('기록 기간',span,true)
    ]);
    var head=h('header',{'class':'pl-sh-head'},[id,tb]);

    /* body left: summary + public specs */
    var left=h('div',{'class':'pl-col'},[
      c.summary_ko?h('p',{'class':'pl-summary',text:c.summary_ko}):null,
      h('h4',{'class':'pl-sub'},['공개 사양',h('span',{text:c.specs.length+'항목'})])
    ]);
    if(c.specs.length){
      var tbody=h('tbody');
      c.specs.forEach(function(s){
        var td=h('td');specValue(td,s.value);
        tbody.appendChild(h('tr',null,[h('th',{scope:'row',text:s.label_ko}),td]));
      });
      left.appendChild(h('table',{'class':'pl-specs'},[
        h('caption',{'class':'sr-only',text:c.name+' 공개 사양'}),
        h('thead',null,[h('tr',null,[h('th',{scope:'col',text:'항목'}),h('th',{scope:'col',text:'공개값'})])]),tbody]));
    }else{
      left.appendChild(h('p',{'class':'pl-empty',text:'이 데이터에는 공개된 수치 사양이 없습니다. 마일스톤과 영상을 참고해 주십시오.'}));
    }

    /* body right: milestone ledger */
    var ol=h('ol',{'class':'pl-ms'});
    c.milestones.forEach(function(m,i){
      var li=h('li',{'class':i===c.milestones.length-1?'is-last':null},[
        h('time',{datetime:m.date,text:ym(m.date)}),
        h('p',{text:m.text_ko})
      ]);
      if(m.source_url) li.appendChild(h('a',{'class':'pl-cite',href:m.source_url,target:'_blank',rel:'noopener','aria-label':'출처 열기: '+host(m.source_url)},[host(m.source_url),extIcon()]));
      ol.appendChild(li);
    });
    var right=h('div',{'class':'pl-col'},[h('h4',{'class':'pl-sub'},['마일스톤',h('span',{text:c.milestones.length+'건'})]),ol]);

    /* media */
    var vids=h('div',{'class':'pl-vids'});
    c.videos.forEach(function(v){vids.appendChild(videoCard(v));});
    var media=h('section',{'class':'pl-media','aria-label':c.name+' 관련 영상'},[
      h('h4',{'class':'pl-sub'},['관련 영상',h('span',{text:c.videos.length+'편'})]),h('p',{'class':'pl-vhint',text:'썸네일을 누르면 이 자리에서 재생됩니다.'}),vids]);

    /* foot: prev / back to index / next */
    var i=order.indexOf(c),prev=order[(i-1+order.length)%order.length],next=order[(i+1)%order.length];
    function step(t,label,cls){
      var b=h('button',{type:'button','class':'pl-step '+cls,'aria-label':label+': '+t.name},[h('small',{text:label}),h('b',{text:t.name})]);
      b.addEventListener('click',function(){select(t.id,{scroll:true,focus:true});});
      return b;
    }
    var up=h('a',{'class':'pl-up',href:'#pl-index'},['업체 색인 ↑']);
    up.addEventListener('click',function(e){
      e.preventDefault();
      var btn=indexEl.querySelector('.pl-co[data-id="'+c.id+'"]');
      var navH=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--nav-h'))||64;
      window.scrollTo({top:q('.pl-index').getBoundingClientRect().top+window.pageYOffset-navH-16,behavior:reduce?'auto':'smooth'});
      if(btn) try{btn.focus({preventScroll:true});}catch(err){btn.focus();}
    });
    var foot=h('footer',{'class':'pl-sh-foot'},[step(prev,'이전 업체','is-prev'),up,step(next,'다음 업체','is-next')]);

    sheetEl.appendChild(head);
    sheetEl.appendChild(h('div',{'class':'pl-sh-body'},[left,right]));
    if(c.videos.length) sheetEl.appendChild(media);
    sheetEl.appendChild(foot);
  }

  function select(id,opt){
    opt=opt||{};
    var c=byId[id]; if(!c) return;
    var changed=state.id!==id||!sheetEl.firstChild;
    state.id=id;
    indexEl.querySelectorAll('.pl-co').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-id')===id));});
    if(changed){
      renderSheet(c);
      if(opt.scroll) liveEl.textContent=c.name+' 사양서를 표시했습니다.';
      if(anim&&opt.scroll) gsap.fromTo(sheetEl.children,{opacity:0},{opacity:1,duration:.45,ease:'power2.out',stagger:.05,clearProps:'opacity'});
      /* refresh synchronously, before any smooth scroll starts, so later sections' triggers match the new height */
      if(ST&&opt.scroll) ST.refresh();
    }
    if(opt.scroll){
      var r=sheetEl.getBoundingClientRect();
      if(opt.focus) try{sheetEl.focus({preventScroll:true});}catch(e){}
      if(opt.focus||r.top>window.innerHeight*0.55||r.top<0) scrollToSheet();
    }
  }

  /* ---------- ledger: every milestone, newest first ---------- */
  var events=[];
  order.forEach(function(c,ci){c.milestones.forEach(function(m){events.push({c:c,ci:ci,m:m});});});
  events.sort(function(a,b){return a.m.date<b.m.date?1:a.m.date>b.m.date?-1:a.ci-b.ci;});
  var lbody=q('[data-pl-ledger-body]');
  if(events.length){
    q('[data-pl-ledger-meta]').textContent=events.length+'건 · '+ym(events[events.length-1].m.date)+' ~ '+ym(events[0].m.date);
  }
  var prevY='';
  events.forEach(function(ev){
    var y=ev.m.date.slice(0,4);
    var co=h('button',{type:'button','class':'pl-lco','aria-label':ev.c.name+' 사양서 보기',text:ev.c.name});
    co.addEventListener('click',function(){select(ev.c.id,{scroll:true,focus:true});});
    lbody.appendChild(h('tr',{'class':prevY&&y!==prevY?'is-y':null},[
      h('td',null,[h('time',{datetime:ev.m.date,text:ym(ev.m.date)})]),
      h('td',null,[co]),
      h('td',{text:ev.m.text_ko}),
      h('td',null,[ev.m.source_url?h('a',{'class':'pl-lsrc',href:ev.m.source_url,target:'_blank',rel:'noopener','aria-label':'출처 열기: '+host(ev.m.source_url),title:host(ev.m.source_url)},['출처',extIcon()]):null])
    ]));
    prevY=y;
  });
  var ledger=q('[data-pl-ledger]');
  ledger.addEventListener('toggle',function(){if(ST) requestAnimationFrame(function(){ST.refresh();});});

  /* ---------- init ---------- */
  if(state.id) select(state.id);
})();
</script>
