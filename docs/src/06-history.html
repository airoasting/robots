<style>
#history{
  background:var(--bg);color:var(--text);font-family:var(--f-body);
  padding-block:clamp(72px,6.5vw,96px);

}
#history [data-era="origin"]{--era:var(--muted)}
#history [data-era="industrial"]{--era:var(--steel)}
#history [data-era="research"]{--era:var(--text)}
#history [data-era="ai"]{--era:var(--accent)}

/* ---------- head ---------- */
#history .hs-head{max-width:none}
#history .h-display{word-break:keep-all}
#history .hs-hl{color:var(--accent)}

/* ---------- era markers: shape + line style, never color alone ---------- */
#history .hs-mk{position:relative;display:inline-block;flex:0 0 auto;width:11px;height:11px}
#history .hs-mk::before{content:"";position:absolute;inset:0;box-sizing:border-box}
#history [data-era="origin"] .hs-mk::before{border:1.5px solid var(--era);border-radius:50%;background:var(--bg)}
#history [data-era="industrial"] .hs-mk::before{background:var(--era)}
#history [data-era="research"] .hs-mk::before{inset:1.5px;background:var(--era);transform:rotate(45deg)}
#history [data-era="ai"] .hs-mk::before{background:var(--era);border-radius:50%}

/* ---------- scale bar (the section's signature figure) ---------- */
#history .hs-scale{margin:clamp(40px,4.5vw,56px) 0 0;padding:18px 0 0;border-top:1px solid var(--line-2)}
#history .hs-cap{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 20px;margin:0 0 22px}
#history .hs-cap-t{font:700 20px/1.35 var(--f-display);letter-spacing:-.01em;color:var(--text)}
#history .hs-cap-m{margin-left:auto;font:500 13px/1.5 var(--f-mono);letter-spacing:.02em;color:var(--dim);font-variant-numeric:tabular-nums}

#history .hs-plot{position:relative;display:grid;grid-template-columns:var(--lab) minmax(0,1fr);padding-top:34px}
#history .hs-keys{margin:0;padding:0;list-style:none}
#history .hs-key{display:flex;align-items:center;gap:10px;height:36px;border-top:1px solid var(--line);font:500 15px/1 var(--f-body);color:var(--text)}
#history .hs-key b{margin-left:auto;margin-right:18px;font:500 14px/1 var(--f-mono);color:var(--dim);font-variant-numeric:tabular-nums}
#history .hs-key[data-era="ai"]{color:var(--accent)}
#history .hs-key[data-era="ai"] b{color:var(--accent-2)}

#history .hs-field{position:relative;border-left:1px solid var(--line-2)}
#history .hs-lane{position:relative;height:36px;border-top:1px solid var(--line)}
#history .hs-span{position:absolute;top:50%;height:0;border-top:2px solid var(--era);transform-origin:left center}
#history [data-era="origin"] .hs-span{border-top:2px dotted var(--era)}
#history [data-era="research"] .hs-span{border-top:2px dashed color-mix(in srgb,var(--era) 70%,transparent)}
#history [data-era="industrial"] .hs-span{border-top-color:color-mix(in srgb,var(--era) 75%,transparent)}
#history [data-era="ai"] .hs-span{border-top-width:3px}
#history .hs-span{margin-top:-1px}

#history .hs-dot{position:absolute;top:50%;width:16px;height:30px;margin:-15px 0 0 -8px;padding:0;border:0;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:inherit;z-index:1}
#history .hs-dot .hs-mk{transition:transform .25s var(--ease)}
#history .hs-dot:hover .hs-mk,#history .hs-dot:focus-visible .hs-mk,#history .hs-dot.is-on .hs-mk{transform:scale(1.55)}
#history .hs-dot:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:2px}

#history .hs-zone{position:absolute;top:-34px;bottom:0;right:0;background:color-mix(in srgb,var(--accent) 11%,transparent);
  border-left:1px solid var(--accent);pointer-events:none}
#history .hs-zone-l{position:absolute;right:100%;top:7px;white-space:nowrap;font:600 14px/1.3 var(--f-mono);letter-spacing:.01em;font-variant-numeric:tabular-nums;color:var(--accent-2);
  padding-right:0}
#history .hs-zone-l::after{content:"";display:inline-block;width:24px;height:1px;margin:0 0 4px 8px;vertical-align:middle;background:var(--accent)}

#history .hs-axis{position:relative;height:34px;border-top:1px solid var(--line-2)}
#history .hs-tick{position:absolute;top:0;height:7px;border-left:1px solid var(--line-2)}
#history .hs-tick span{position:absolute;top:10px;left:0;transform:translateX(-50%);font:500 13px/1 var(--f-mono);color:var(--dim);font-variant-numeric:tabular-nums}
#history .hs-tick.is-end{border-left-color:var(--accent)}
#history .hs-tick.is-end span{color:var(--accent-2);font-weight:600}
#history .hs-tick.is-minor{height:4px}
#history .hs-tick.is-minor span{display:none}
#history .hs-axis-k{display:flex;align-items:flex-start;padding-top:10px;font:500 13px/1 var(--f-mono);color:var(--dim)}

#history .hs-read{min-height:28px;margin:14px 0 0;padding-left:var(--lab);font-size:16px;line-height:1.6;color:var(--muted)}
#history .hs-read b{font:700 16px/1 var(--f-display);color:var(--text);font-variant-numeric:tabular-nums;margin-right:10px}
#history .hs-read em{font-style:normal;font:500 13px/1 var(--f-mono);color:var(--dim);margin-right:10px}
#history .hs-read[data-era="ai"] b{color:var(--accent)}

/* draw-in (JS adds .is-drawn when the figure enters; reduced motion gets it at once) */
#history .hs-plot.is-armed .hs-span{transform:scaleX(0)}
#history .hs-plot.is-armed .hs-dot{opacity:0}
#history .hs-plot.is-drawn .hs-span{transform:none;transition:transform 1s var(--ease)}
#history .hs-plot.is-drawn .hs-dot{opacity:1;transition:opacity .45s var(--ease)}

/* ---------- ledger ---------- */
#history .hs-ledger{margin-top:clamp(40px,4vw,56px)}
#history .hs-band{display:grid;grid-template-columns:var(--lab) minmax(0,1fr);column-gap:0;border-top:1px solid var(--line-2)}
#history .hs-band + .hs-band{margin-top:0}
#history .hs-band-h{padding:18px 24px 22px 0}
#history .hs-band-name{margin:0;font:700 24px/1.25 var(--f-display);letter-spacing:-.015em;color:var(--text);word-break:keep-all}
#history .hs-band-range{display:block;margin-top:8px;font:500 14px/1.5 var(--f-mono);color:var(--dim);font-variant-numeric:tabular-nums}
#history .hs-band-range b{display:block;font-weight:500}
#history .hs-band-note{margin:14px 0 0;font-size:15px;line-height:1.6;color:var(--muted);word-break:keep-all}
#history .hs-mix{display:flex;flex-direction:column;gap:6px;margin:16px 0 0;padding:12px 0 0;border-top:1px solid var(--line);list-style:none}
#history .hs-mix li{display:flex;align-items:center;gap:8px;font:500 14px/1.3 var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}

#history .hs-band[data-period="ai"]{border-top:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 5%,transparent)}
#history .hs-band[data-period="ai"] .hs-band-h{padding-left:16px}
#history .hs-band[data-period="ai"] .hs-band-name{color:var(--accent)}
#history .hs-band[data-period="ai"] .hs-band-range{color:var(--accent-2)}

#history .hs-rows{margin:0;padding:0;list-style:none}
#history .hs-row{display:grid;grid-template-columns:92px minmax(0,268px) minmax(0,1fr);column-gap:28px;align-items:start;
  padding:15px 16px 15px 0;border-top:1px solid var(--line);scroll-margin-top:calc(var(--nav-h) + 24px);
  transition:background-color 1.2s var(--ease)}
#history .hs-row:first-child{border-top:0}
#history .hs-band[data-period="ai"] .hs-row{border-top-color:color-mix(in srgb,var(--accent) 28%,var(--line))}
#history .hs-band[data-period="ai"] .hs-row:first-child{border-top:0}
#history .hs-row:focus{outline:none}
#history .hs-row.is-hit{background:color-mix(in srgb,var(--accent) 16%,transparent);transition:none}

#history .hs-year{font:700 36px/1 var(--f-display);letter-spacing:-.025em;color:var(--text);font-variant-numeric:tabular-nums lining-nums;padding-top:2px}
#history .hs-row[data-era="ai"] .hs-year{color:var(--accent)}
#history .hs-tag{display:flex;align-items:center;gap:8px;margin:2px 0 6px;font:500 13px/1.3 var(--f-mono);color:var(--dim)}
#history .hs-row[data-era="ai"] .hs-tag{color:var(--accent-2)}
#history .hs-t{margin:0;font:600 18px/1.45 var(--f-body);color:var(--text);word-break:keep-all}
#history .hs-d{margin:0;padding-top:2px;font-size:16px;line-height:1.62;color:var(--muted);word-break:keep-all}

/* ---------- medium: band name sits above its rows ---------- */
@media (max-width:1180px){
  #history{--lab:120px}
  #history .hs-band{display:block}
  #history .hs-band-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding:18px 0 14px;border-bottom:1px solid var(--line)}
  #history .hs-band[data-period="ai"] .hs-band-h{padding-left:16px;padding-right:16px;border-bottom-color:color-mix(in srgb,var(--accent) 28%,var(--line))}
  #history .hs-band-range{margin:0}
  #history .hs-band-range b{display:inline;margin-left:12px}
  #history .hs-band-note{flex:1 1 100%;margin:4px 0 0}
  #history .hs-mix{flex-direction:row;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;border:0}
  #history .hs-row:first-child{border-top:0}
  #history .hs-band[data-period="ai"] .hs-row{padding-left:16px}
}

/* ---------- mobile: vertical ledger ---------- */
@media (max-width:760px){
  #history{--lab:84px}
  #history .hs-cap-m{margin-left:0}
  #history .hs-key{gap:7px;font-size:14px;height:34px}
  #history .hs-key b{margin-right:10px;font-size:13px}
  #history .hs-lane{height:34px}
  #history .hs-dot{width:10px;margin-left:-5px}
  #history .hs-mk{width:9px;height:9px}
  #history .hs-zone-l{font-size:13px;padding-right:4px}
  #history .hs-zone-l::before{width:12px;margin-right:5px}
  #history .hs-tick.is-mid span{display:none}
  #history .hs-read{padding-left:0;font-size:15px}

  #history .hs-row{grid-template-columns:auto minmax(0,1fr);column-gap:14px;row-gap:6px;padding:18px 0}
  #history .hs-band[data-period="ai"] .hs-row{padding:18px 14px}
  #history .hs-band[data-period="ai"] .hs-band-h{padding-left:14px;padding-right:14px}
  #history .hs-year{grid-column:1;grid-row:1;font-size:28px;align-self:center;padding-top:0}
  #history .hs-what{display:contents}
  #history .hs-tag{grid-column:2;grid-row:1;align-self:center;margin:0}
  #history .hs-t{grid-column:1 / -1;grid-row:2;font-size:17px;margin-top:4px}
  #history .hs-d{grid-column:1 / -1;grid-row:3;padding-top:0}
  #history .hs-band-name{font-size:22px}
}

@media (prefers-reduced-motion:reduce){
  #history .hs-row,#history .hs-dot .hs-mk{transition:none}
  #history .hs-plot.is-armed .hs-span{transform:none}
  #history .hs-plot.is-armed .hs-dot{opacity:1}
}
</style>

<script>
(function(){
  var root=document.getElementById('history');
  if(!root) return;
  var data;
  try{ data=JSON.parse(document.getElementById('history-data').textContent); }catch(e){ return; }
  if(!data || !data.length) return;
  data=data.slice().sort(function(a,b){return a.year-b.year;});

  var ERA={origin:'기원',industrial:'산업화',research:'연구',ai:'AI'};
  var ORDER=['origin','industrial','research','ai'];
  var PERIOD={
    origin:{name:'기원',note:'단어와 원칙, 특허가 기계보다 먼저 나왔습니다.'},
    mid:{name:'산업화와 연구',note:'공장의 팔과 연구실의 두 발 보행이 나란히 자랐습니다.'},
    ai:{name:'AI',note:'AI 모델이 로봇의 두뇌가 된 구간입니다. 사건 간격이 1~2년으로 좁아집니다.'}
  };
  var RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function all(sel){return [].slice.call(root.querySelectorAll(sel));}
  function fill(key,val){all('[data-hs="'+key+'"]').forEach(function(el){el.textContent=val;});}

  var minY=data[0].year, maxY=data[data.length-1].year, span=Math.max(1,maxY-minY);
  var ai=data.filter(function(d){return d.era==='ai';});
  var aiFrom=ai.length?ai[0].year:maxY;
  fill('n',data.length); fill('min',minY); fill('max',maxY); fill('span',span);
  fill('ai-n',ai.length); fill('ai-from',aiFrom);

  /* ---------- scale bar ---------- */
  var d0=minY-2, d1=maxY+2;
  function x(y){return ((y-d0)/(d1-d0)*100).toFixed(3)+'%';}
  var byEra={}; ORDER.forEach(function(k){byEra[k]=[];});
  data.forEach(function(d,i){ d._i=i; (byEra[d.era]||(byEra[d.era]=[])).push(d); });
  var eras=ORDER.filter(function(k){return byEra[k].length;});

  var keys='<ul class="hs-keys" aria-hidden="true">'+eras.map(function(k){
    return '<li class="hs-key" data-era="'+k+'"><i class="hs-mk"></i>'+ERA[k]+'<b>'+byEra[k].length+'</b></li>';
  }).join('')+'<li class="hs-axis-k">연도</li></ul>';

  var lanes=eras.map(function(k){
    var L=byEra[k], a=L[0].year, b=L[L.length-1].year;
    var s='<div class="hs-lane" data-era="'+k+'">';
    if(b>a) s+='<span class="hs-span" style="left:'+x(a)+';width:calc('+x(b)+' - '+x(a)+')"></span>';
    s+=L.map(function(d){
      return '<button type="button" class="hs-dot" data-i="'+d._i+'" style="left:'+x(d.year)+'" aria-label="'+esc(d.year+'년, '+d.title_ko+'. 원장 행으로 이동')+'"><i class="hs-mk"></i></button>';
    }).join('');
    return s+'</div>';
  }).join('');

  var ticks='';
  for(var y=Math.ceil(minY/10)*10;y<=maxY;y+=10){
    var cls=(y===minY||y%40===0)?'':' is-mid';
    ticks+='<span class="hs-tick'+cls+'" style="left:'+x(y)+'"><span>'+y+'</span></span>';
    for(var m=y+5;m<y+10&&m<maxY;m+=5) ticks+='<span class="hs-tick is-minor" style="left:'+x(m)+'"></span>';
  }
  if(maxY%10) ticks+='<span class="hs-tick is-end" style="left:'+x(maxY)+'"><span>'+maxY+'</span></span>';

  var zone=ai.length?'<div class="hs-zone" style="left:'+x(aiFrom-.5)+'"><span class="hs-zone-l">'+aiFrom+'~'+maxY+' · '+ai.length+'건</span></div>':'';

  var plot=root.querySelector('[data-hs="plot"]');
  plot.innerHTML=keys+'<div class="hs-field">'+zone+lanes+'<div class="hs-axis" aria-hidden="true">'+ticks+'</div></div>';

  /* ---------- ledger ---------- */
  function period(e){return e.era==='origin'?'origin':(e.era==='ai'?'ai':'mid');}
  var bands=[];
  data.forEach(function(d){
    var p=period(d), last=bands[bands.length-1];
    if(!last||last.p!==p){ last={p:p,rows:[]}; bands.push(last); }
    last.rows.push(d);
  });
  function mix(rows){
    var c={}; rows.forEach(function(d){c[d.era]=(c[d.era]||0)+1;});
    var ks=ORDER.filter(function(k){return c[k];});
    if(ks.length<2) return '';
    return '<ul class="hs-mix">'+ks.map(function(k){return '<li data-era="'+k+'"><i class="hs-mk"></i>'+ERA[k]+' '+c[k]+'건</li>';}).join('')+'</ul>';
  }
  var ledger=root.querySelector('[data-hs="ledger"]');
  ledger.innerHTML=bands.map(function(B){
    var P=PERIOD[B.p], a=B.rows[0].year, b=B.rows[B.rows.length-1].year;
    return '<div class="hs-band reveal" data-period="'+B.p+'" role="group" aria-label="'+esc(P.name+' '+a+'~'+b)+'">'+
      '<div class="hs-band-h"><h3 class="hs-band-name">'+P.name+'</h3>'+
      '<span class="hs-band-range">'+a+'~'+b+'<b>'+B.rows.length+'건</b></span>'+
      '<p class="hs-band-note">'+P.note+'</p>'+mix(B.rows)+'</div>'+
      '<ol class="hs-rows">'+B.rows.map(function(d){
        return '<li class="hs-row" data-era="'+esc(d.era)+'" id="hs-e'+d._i+'" tabindex="-1">'+
          '<span class="hs-year">'+esc(d.year)+'</span>'+
          '<div class="hs-what"><span class="hs-tag"><i class="hs-mk"></i>'+esc(ERA[d.era]||d.era)+'</span>'+
          '<h4 class="hs-t">'+esc(d.title_ko)+'</h4></div>'+
          '<p class="hs-d">'+esc(d.desc_ko)+'</p></li>';
      }).join('')+'</ol></div>';
  }).join('');

  /* ---------- readout + jump ---------- */
  var read=root.querySelector('[data-hs="read"]');
  var DEFAULT='점을 누르면 아래 원장의 해당 행으로 이동합니다.';
  function setRead(d){
    if(!d){ read.removeAttribute('data-era'); read.textContent=DEFAULT; return; }
    read.setAttribute('data-era',d.era);
    read.innerHTML='<b>'+esc(d.year)+'</b><em>'+esc(ERA[d.era]||'')+'</em>'+esc(d.title_ko);
  }
  setRead(null);
  var dots=all('.hs-dot');
  var hitTimer=0;
  dots.forEach(function(btn){
    var d=data[+btn.getAttribute('data-i')];
    btn.addEventListener('mouseenter',function(){setRead(d);});
    btn.addEventListener('focus',function(){setRead(d);});
    btn.addEventListener('mouseleave',function(){setRead(null);});
    btn.addEventListener('blur',function(){setRead(null);});
    btn.addEventListener('click',function(){
      var row=document.getElementById('hs-e'+d._i);
      if(!row) return;
      var band=row.closest('.hs-band'); if(band) band.classList.add('is-in');
      var navH=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--nav-h'))||64;
      var top=row.getBoundingClientRect().top+window.scrollY-navH-24;
      window.scrollTo({top:Math.max(0,top),behavior:RM?'auto':'smooth'});
      try{ row.focus({preventScroll:true}); }catch(e){}
      all('.hs-row.is-hit').forEach(function(r){r.classList.remove('is-hit');});
      clearTimeout(hitTimer);
      row.classList.add('is-hit');
      hitTimer=setTimeout(function(){row.classList.remove('is-hit');},1400);
    });
  });

  /* ---------- draw-in ---------- */
  if(RM || !('IntersectionObserver' in window)){ plot.classList.add('is-drawn'); return; }
  plot.classList.add('is-armed');
  dots.forEach(function(b,i){ b.style.transitionDelay=(300+i*40)+'ms'; });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(!en.isIntersecting) return;
      plot.classList.add('is-drawn'); plot.classList.remove('is-armed');
      setTimeout(function(){ dots.forEach(function(b){ b.style.transitionDelay=''; }); },1600);
      io.disconnect();
    });
  },{rootMargin:'0px 0px -15% 0px'});
  io.observe(plot);
})();
</script>
