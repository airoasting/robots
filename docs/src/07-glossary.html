#glossary .h-display{word-break:keep-all}
#glossary .lead{word-break:keep-all}

#glossary .gl-search-label{display:block;margin-bottom:10px;font:600 14px/1.4 var(--f-body);color:var(--text)}
#glossary .gl-field{
  position:relative;display:flex;align-items:center;gap:12px;
  padding:0 8px 0 14px;height:52px;border:1px solid var(--line-2);border-radius:var(--radius);
  background:var(--bg);transition:border-color .25s var(--ease);
}
#glossary .gl-field:focus-within{border-color:var(--accent);outline:1px solid var(--accent);outline-offset:0}
#glossary .gl-ico{flex:0 0 18px;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linecap:round}
#glossary .gl-field input{
  flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--text);
  font-family:var(--f-body);font-size:16px;-webkit-appearance:none;appearance:none;
}
#glossary .gl-field input::placeholder{color:var(--dim)}
#glossary .gl-field input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
#glossary .gl-clear{
  flex:0 0 auto;padding:7px 10px;border:1px solid var(--line-2);border-radius:2px;background:transparent;
  color:var(--muted);font:500 13px/1 var(--f-body);cursor:pointer;
}
#glossary .gl-clear:hover{color:var(--text);border-color:var(--muted)}
#glossary .gl-status{margin:10px 0 0;font:500 13px/1.4 var(--f-mono);color:var(--dim);font-variant-numeric:tabular-nums}
#glossary .gl-status b{font-weight:600;color:var(--accent)}

/* thumb index: ㄱ to ㅎ, then Latin */
#glossary .gl-index{display:flex;flex-wrap:wrap;align-items:stretch;margin:clamp(40px,4vw,56px) 0 0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line)}
#glossary .gl-jump{
  flex:0 0 auto;min-width:44px;height:46px;padding:0 10px;border:0;border-right:1px solid var(--line);background:transparent;
  font:700 17px/1 var(--f-display);color:var(--text);cursor:pointer;transition:color .2s var(--ease),background .2s var(--ease);
}
#glossary .gl-jump:first-child{border-left:1px solid var(--line)}
#glossary .gl-jump.is-latin{padding:0 14px;font:500 14px/1 var(--f-body)}
#glossary .gl-jump:hover:not(:disabled){background:var(--surface);color:var(--accent-2)}
#glossary .gl-jump:disabled{font-weight:500;color:var(--dim);cursor:default;text-decoration:line-through;text-decoration-color:var(--line-2)}
#glossary .gl-jump:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* dictionary: ruled multi-column setting */
#glossary .gl-dict{margin-top:8px;columns:1;column-gap:48px;column-rule:1px solid var(--line);column-fill:balance}
@media (min-width:720px){#glossary .gl-dict{columns:2}}
@media (min-width:1180px){#glossary .gl-dict{columns:3}}
#glossary .gl-ent{break-inside:avoid;padding:14px 0 16px;border-bottom:1px solid var(--line);scroll-margin-top:calc(var(--nav-h) + 24px);outline:1px solid transparent;outline-offset:6px;transition:outline-color .6s var(--ease)}
#glossary .gl-ent[hidden]{display:none}
#glossary .gl-ent.is-last{border-bottom:0}
#glossary .gl-ent.is-hit{outline-color:var(--accent)}
#glossary .gl-ini{
  display:flex;align-items:baseline;gap:12px;margin:0;padding-bottom:8px;border-bottom:1px solid var(--line-2);
  font:700 26px/1 var(--f-display);letter-spacing:-.02em;color:var(--accent);
}
#glossary .gl-ini.is-latin{font:700 17px/1.6 var(--f-body);letter-spacing:-.01em}
#glossary .gl-ini small{margin-left:auto;font:500 13px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--dim)}
#glossary .gl-ent:has(.gl-ini){padding-top:16px}
#glossary .gl-ent:has(.gl-ini) .gl-ini{margin:0 0 12px}
#glossary .gl-term{margin:0;font:700 20px/1.35 var(--f-display);letter-spacing:-.02em;color:var(--text);word-break:keep-all}
#glossary .gl-en{margin:3px 0 0;font:500 13px/1.5 var(--f-mono);letter-spacing:0;color:var(--dim)}
#glossary .gl-def{margin:8px 0 0;font-size:16px;line-height:1.66;color:var(--muted);word-break:keep-all}
#glossary .gl-see{font-size:15px;color:var(--dim);white-space:normal}
#glossary .gl-see a,#glossary .gl-xref{color:var(--steel-ink);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;transition:color .2s var(--ease),text-decoration-color .2s var(--ease)}
#glossary .gl-see a:hover,#glossary .gl-xref:hover{color:var(--accent-2);text-decoration-color:var(--accent)}
#glossary .gl-nw{white-space:nowrap}
#glossary .gl-see i{font-style:normal;margin:0 6px 0 2px;color:var(--accent)}
#glossary mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--text);border-radius:2px;padding:0 1px}
#glossary .gl-empty{margin:24px 0 0;padding:40px 24px;border:1px solid var(--line);border-radius:var(--radius);text-align:center;font-size:16px;color:var(--muted);word-break:keep-all}

/* FAQ: ruled list, serif questions, 17px answers */
#glossary .gl-faq-block{display:grid;grid-template-columns:1fr;gap:28px;margin-top:clamp(80px,8vw,120px);padding-top:28px;border-top:1px solid var(--line-2)}
@media (min-width:1080px){#glossary .gl-faq-block{grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:clamp(48px,6vw,96px)}}
#glossary .gl-sub{margin:0;font:700 clamp(28px,2.8vw,40px)/1.25 var(--f-display);letter-spacing:-.02em;color:var(--text)}
#glossary .gl-faq-lead{margin:16px 0 0;max-width:420px;font-size:16px;line-height:1.75;color:var(--muted);word-break:keep-all}
#glossary .gl-faq{border-top:1px solid var(--line-2)}
#glossary .gl-qa{border-bottom:1px solid var(--line)}
#glossary .gl-qh{margin:0;font:inherit}
#glossary .gl-q{
  display:grid;grid-template-columns:52px 1fr 24px;gap:16px;align-items:start;width:100%;
  padding:24px 0;border:0;background:transparent;color:var(--text);text-align:left;cursor:pointer;
  scroll-margin-top:calc(var(--nav-h) + 32px);
}
#glossary .gl-q:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:2px}
#glossary .gl-qn{padding-top:5px;font:600 13px/1.4 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--dim)}
#glossary .gl-qa.is-open .gl-qn{color:var(--accent)}
#glossary .gl-qt{font:700 clamp(18px,1.55vw,21px)/1.5 var(--f-display);letter-spacing:-.02em;word-break:keep-all;text-wrap:pretty}
#glossary .gl-q:hover .gl-qt{color:var(--accent-2)}
#glossary .gl-pm{font:400 24px/1.2 var(--f-body);color:var(--muted);text-align:center}
#glossary .gl-qa.is-open .gl-pm{color:var(--accent)}
#glossary .gl-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
#glossary .gl-qa.is-open .gl-a{grid-template-rows:1fr}
#glossary .gl-a-in{overflow:hidden}
#glossary .gl-a p{
  margin:0;padding:0 40px 28px 68px;max-width:none;
  font-size:17px;line-height:1.8;color:var(--muted);word-break:keep-all;
  opacity:0;transition:opacity .35s var(--ease);
}
#glossary .gl-qa.is-open .gl-a p{opacity:1;transition-delay:.08s}
@media (max-width:560px){
  #glossary .gl-index{margin-top:32px}
  #glossary .gl-jump{min-width:0;flex:1 0 12.5%;height:44px;padding:0 4px;font-size:16px}
  #glossary .gl-jump.is-latin{flex:1 0 100%;border-left:1px solid var(--line);border-top:1px solid var(--line)}
  #glossary .gl-jump:nth-child(8n+1){border-left:1px solid var(--line)}
  #glossary .gl-q{grid-template-columns:1fr 24px;gap:6px 12px;padding:20px 0}
  #glossary .gl-qn{grid-column:1 / -1;padding-top:0}
  #glossary .gl-pm{grid-column:2;grid-row:2}
  #glossary .gl-a p{padding:0 0 24px}
}
@media (prefers-reduced-motion:reduce){
  #glossary .gl-a,#glossary .gl-a p,#glossary .gl-ent,#glossary .gl-field,#glossary .gl-jump{transition:none!important}
}
</style>

<script>
(function(){
  var root=document.getElementById('glossary');
  if(!root) return;
  var terms,faq;
  try{
    terms=JSON.parse(document.getElementById('glossary-data').textContent);
    faq=JSON.parse(document.getElementById('faq-data').textContent);
  }catch(e){ return; }

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
  function norm(s){return String(s||'').normalize('NFC').toLowerCase();}
  function pad(n){return (n<10?'0':'')+n;}
  function refresh(ms){
    if(!window.ScrollTrigger) return;
    clearTimeout(refreshTimer);
    refreshTimer=setTimeout(function(){ window.ScrollTrigger && ScrollTrigger.refresh(); },ms);
  }
  var refreshTimer=0;

  /* ---- 자모 머리글 ---- */
  var CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', FOLD={'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};
  var HEADS=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ','영문·숫자'];
  var LATIN='영문·숫자';
  function initial(s){
    var c=String(s).normalize('NFC').charCodeAt(0);
    if(c>=0xAC00&&c<=0xD7A3){var j=CHO.charAt(Math.floor((c-0xAC00)/588));return FOLD[j]||j;}
    return LATIN;
  }

  /* 가나다순. 영문·숫자 표제어는 끝에 둡니다 */
  var list=terms.map(function(t,i){return {t:t,i:i,g:initial(t.term_ko)};});
  list.sort(function(a,b){
    var la=a.g===LATIN?1:0, lb=b.g===LATIN?1:0;
    return la-lb || a.t.term_ko.localeCompare(b.t.term_ko,'ko');
  });
  var byKo={}; list.forEach(function(e){byKo[e.t.term_ko]=e;});
  function tid(e){return 'gl-t-'+e.i;}

  /* ---- 상호참조: 정의에 나온 표제어 + data의 see 필드(표제어끼리의 편집 참조) ---- */
  var keys=list.map(function(e){return e.t.term_ko;});
  function seeOf(e){
    var out=[], ko=e.t.term_ko;
    keys.forEach(function(k){ if(k!==ko && e.t.def_ko.indexOf(k)!==-1) out.push(k); });
    (e.t.see||[]).forEach(function(k){ if(byKo[k] && out.indexOf(k)===-1) out.push(k); });
    return out;
  }

  /* ---- render dictionary ---- */
  var dict=root.querySelector('[data-gl-dict]');
  var empty=root.querySelector('[data-gl-empty]');
  var shownEl=root.querySelector('[data-gl-shown]');
  [].forEach.call(root.querySelectorAll('[data-gl-total]'),function(el){el.textContent=terms.length;});
  [].forEach.call(root.querySelectorAll('[data-gl-faq-total]'),function(el){el.textContent=faq.length;});
  shownEl.textContent=terms.length;

  dict.innerHTML=list.map(function(e){
    var see=seeOf(e);
    return '<article class="gl-ent" tabindex="-1" data-g="'+esc(e.g)+'" id="'+tid(e)+'">'+
      '<h4 class="gl-term" data-f="term_ko">'+esc(e.t.term_ko)+'</h4>'+
      '<p class="gl-en" lang="en" data-f="term_en">'+esc(e.t.term_en)+'</p>'+
      '<p class="gl-def"><span data-f="def_ko">'+esc(e.t.def_ko)+'</span>'+
      (see.length?' <span class="gl-see">'+see.map(function(k,j){var l='<a href="#'+tid(byKo[k])+'" data-gl-ref>'+esc(k)+'</a>';return j?l:'<span class="gl-nw"><i aria-hidden="true">→</i><span class="sr-only">참조 </span>'+l+'</span>';}).join(', ')+'</span>':'')+
      '</p>'+
    '</article>';
  }).join('');
  var ents=[].slice.call(dict.children);

  /* group heads: one node per group, moved into the first visible entry */
  var groups={}, order=[];
  ents.forEach(function(el,k){
    var g=list[k].g;
    if(!groups[g]){groups[g]={els:[],head:document.createElement('h3')};order.push(g);}
    groups[g].els.push(el);
  });
  order.forEach(function(g){
    var h=groups[g].head;
    h.className='gl-ini'+(g===LATIN?' is-latin':'');
    h.innerHTML=esc(g)+'<small></small>';
  });

  /* thumb index */
  var idx=root.querySelector('[data-gl-index]');
  idx.innerHTML=HEADS.map(function(g){
    return '<button type="button" class="gl-jump'+(g===LATIN?' is-latin':'')+'" data-gl-jump="'+esc(g)+'">'+esc(g)+'</button>';
  }).join('');
  var jumps=[].slice.call(idx.children);

  var hay=list.map(function(e){var t=e.t;return norm(t.term_ko+' '+t.term_en+' '+t.def_ko)+' '+norm(t.term_ko).replace(/\s+/g,'')+' '+norm(t.term_en).replace(/\s+/g,'');});
  function highlight(text,tokens){
    if(!tokens.length) return esc(text);
    var re=new RegExp('('+tokens.map(reEsc).sort(function(a,b){return b.length-a.length;}).join('|')+')','gi');
    return String(text).split(re).map(function(part,i){return i%2?'<mark>'+esc(part)+'</mark>':esc(part);}).join('');
  }

  function layoutGroups(){
    var lastVisible=null;
    order.forEach(function(g){
      var G=groups[g], vis=G.els.filter(function(el){return !el.hidden;});
      G.vis=vis.length;
      if(vis.length){ vis[0].insertBefore(G.head,vis[0].firstChild); G.head.lastChild.textContent=vis.length; }
      else if(G.head.parentNode){ G.head.parentNode.removeChild(G.head); }
      G.els.forEach(function(el){el.classList.remove('is-last');});
      if(vis.length) vis[vis.length-1].classList.add('is-last');
    });
    jumps.forEach(function(b){ var G=groups[b.getAttribute('data-gl-jump')]; b.disabled=!(G&&G.vis); });
  }

  var input=root.querySelector('#gl-q');
  var clearBtn=root.querySelector('[data-gl-clear]');
  var revealed=false;

  function apply(){
    var raw=norm(input.value).trim();
    var tokens=raw?raw.split(/\s+/).filter(Boolean):[];
    var n=0;
    if(!revealed && tokens.length) finishReveal();
    ents.forEach(function(el,i){
      var ok=tokens.every(function(tk){return hay[i].indexOf(tk)!==-1;});
      el.hidden=!ok;
      if(ok){
        n++;
        var t=list[i].t;
        el.querySelectorAll('[data-f]').forEach(function(f){f.innerHTML=highlight(t[f.getAttribute('data-f')],tokens);});
      }
    });
    layoutGroups();
    shownEl.textContent=n;
    empty.hidden=n!==0;
    clearBtn.hidden=!input.value;
    refresh(250);
  }
  input.addEventListener('input',apply);
  input.addEventListener('keydown',function(e){if(e.key==='Escape'&&input.value){input.value='';apply();}});
  clearBtn.addEventListener('click',function(){input.value='';apply();input.focus();});
  layoutGroups();

  /* scroll helpers */
  var RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function navH(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--nav-h'))||64;}
  function goTo(el,flash){
    if(!revealed) finishReveal();
    var y=el.getBoundingClientRect().top+window.scrollY-navH()-24;
    window.scrollTo({top:Math.max(0,y),behavior:RM?'auto':'smooth'});
    /* a ScrollTrigger refresh can cut a smooth scroll short; finish the jump once it settles */
    setTimeout(function(){
      var y2=el.getBoundingClientRect().top+window.scrollY-navH()-24;
      if(Math.abs(window.scrollY-y2)>4) window.scrollTo({top:Math.max(0,y2),behavior:'auto'});
    },900);
    if(flash){
      el.classList.add('is-hit');
      try{el.focus({preventScroll:true});}catch(_){}
      setTimeout(function(){el.classList.remove('is-hit');},1600);
    }
  }
  idx.addEventListener('click',function(e){
    var b=e.target.closest('[data-gl-jump]'); if(!b||b.disabled) return;
    var G=groups[b.getAttribute('data-gl-jump')]; if(!G||!G.head.parentNode) return;
    goTo(G.head.parentNode,false);
  });
  root.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[data-gl-ref]'); if(!a) return;
    var el=document.getElementById(a.getAttribute('href').slice(1)); if(!el) return;
    e.preventDefault();
    if(el.hidden){ input.value=''; apply(); clearTimeout(refreshTimer); window.ScrollTrigger && ScrollTrigger.refresh(); }
    goTo(el,true);
  });

  /* ---- FAQ accordion ---- */
  var faqWrap=root.querySelector('[data-gl-faq]');
  var linkRe=new RegExp('('+keys.slice().sort(function(a,b){return b.length-a.length;}).map(reEsc).join('|')+')','g');
  function linkTerms(text){
    var used={};
    return String(text).split(linkRe).map(function(part,i){
      if(i%2 && byKo[part] && !used[part]){ used[part]=1; return '<a class="gl-xref" href="#'+tid(byKo[part])+'" data-gl-ref>'+esc(part)+'</a>'; }
      return esc(part);
    }).join('');
  }
  faqWrap.innerHTML=faq.map(function(f,i){
    var id='gl-faq-'+(i+1);
    return '<div class="gl-qa">'+
      '<h4 class="gl-qh"><button type="button" class="gl-q" aria-expanded="false" aria-controls="'+id+'" id="'+id+'-q">'+
        '<span class="gl-qn">Q.'+pad(i+1)+'</span><span class="gl-qt">'+esc(f.q_ko)+'</span><span class="gl-pm" aria-hidden="true">+</span>'+
      '</button></h4>'+
      '<div class="gl-a" id="'+id+'" role="region" aria-labelledby="'+id+'-q"><div class="gl-a-in"><p>'+linkTerms(f.a_ko)+'</p></div></div>'+
    '</div>';
  }).join('');
  var qas=[].slice.call(faqWrap.children);
  function setOpen(qa,open){
    qa.classList.toggle('is-open',open);
    qa.querySelector('.gl-q').setAttribute('aria-expanded',open?'true':'false');
    qa.querySelector('.gl-pm').textContent=open?'−':'+';
    qa.querySelector('.gl-a').inert=!open;
  }
  /* 마지막 질문(리더의 첫 행동)은 펼쳐 둡니다. 3분 요약의 #gl-faq-5-q 링크가 이 자리로 옵니다 */
  qas.forEach(function(qa,i){
    setOpen(qa,i===qas.length-1);
    qa.querySelector('.gl-q').addEventListener('click',function(){
      setOpen(qa,!qa.classList.contains('is-open'));
      refresh(600);
    });
  });
  function openFromHash(h){
    var m=/^#?(gl-faq-\d+)(-q)?$/.exec(h||''); if(!m) return false;
    var b=document.getElementById(m[1]+'-q'); if(!b) return false;
    var qa=b.closest('.gl-qa'); if(!qa) return false;
    if(!qa.classList.contains('is-open')){ setOpen(qa,true); refresh(600); }
    return true;
  }
  /* links like #gl-faq-5-q (e.g. from the 3-minute brief) open that answer */
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href^="#gl-faq-"]'); if(!a) return;
    openFromHash(a.getAttribute('href'));
  });
  openFromHash(location.hash);
  window.addEventListener('hashchange',function(){openFromHash(location.hash);});

  /* ---- reveal ---- */
  var gsap=window.gsap, ST=window.ScrollTrigger;
  var batchTriggers=[];
  function finishReveal(){
    revealed=true;
    if(!gsap) return;
    batchTriggers.forEach(function(t){t.kill();});
    gsap.killTweensOf(ents);
    gsap.set(ents,{clearProps:'opacity,transform'});
  }
  if(RM || !gsap || !ST){ revealed=true; return; }
  gsap.registerPlugin(ST);
  gsap.from(root.querySelectorAll('.gl-head-text,.gl-search,.gl-index'),{
    opacity:0,y:20,duration:.8,ease:'power3.out',stagger:.08,
    scrollTrigger:{trigger:root,start:'top 78%',once:true}
  });
  gsap.set(ents,{opacity:0});
  batchTriggers=ST.batch(ents,{
    start:'top 92%',once:true,
    onEnter:function(b){gsap.to(b,{opacity:1,duration:.7,ease:'power2.out',stagger:.04,overwrite:true});}
  });
  var fb=root.querySelector('.gl-faq-block');
  gsap.from(fb.querySelectorAll('.gl-faq-head,.gl-qa'),{
    opacity:0,y:20,duration:.8,ease:'power3.out',stagger:.06,
    scrollTrigger:{trigger:fb,start:'top 80%',once:true}
  });
})();
</script>
